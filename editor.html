<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Pirate Character Editor V0.2</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html,body { width:100%; height:100%; overflow:hidden; background:#091018; color:#fff; font-family:Arial,"Microsoft JhengHei",sans-serif; }
    body { display:grid; grid-template-columns:minmax(0,1fr) 390px; }
    button,input,select { font:inherit; }
    #viewport {
      position:relative;
      min-width:0;
      overflow:hidden;
      background:radial-gradient(circle at 50% 32%,#2a4353 0%,#142430 48%,#081018 100%);
    }
    #viewport canvas { display:block; width:100%; height:100%; }
    #topbar {
      position:absolute; top:14px; left:14px; right:14px; z-index:20;
      display:flex; justify-content:space-between; align-items:flex-start; gap:10px; pointer-events:none;
    }
    .toolbar-group { display:flex; flex-wrap:wrap; gap:8px; pointer-events:auto; }
    .toolbar-button,.back-link {
      padding:9px 13px; border:1px solid rgba(255,255,255,.18); border-radius:8px;
      color:#fff; background:rgba(12,24,34,.82); text-decoration:none; cursor:pointer; backdrop-filter:blur(8px);
    }
    .toolbar-button:hover,.back-link:hover { border-color:rgba(255,255,255,.45); background:rgba(29,46,59,.94); }
    .back-link { background:rgba(112,54,34,.86); }
    #hint {
      position:absolute; left:50%; bottom:14px; z-index:20; transform:translateX(-50%);
      padding:7px 12px; border-radius:999px; color:rgba(255,255,255,.58);
      background:rgba(4,10,15,.58); font-size:12px; white-space:nowrap;
    }
    #panel {
      height:100%; overflow-y:auto; padding:18px; background:#111a23; border-left:1px solid rgba(255,255,255,.08);
    }
    h1 { font-size:22px; margin-bottom:5px; }
    .subtitle { color:rgba(255,255,255,.56); font-size:13px; line-height:1.55; margin-bottom:16px; }
    .section { margin-bottom:18px; padding-bottom:16px; border-bottom:1px solid rgba(255,255,255,.08); }
    .section h2 { color:#e7c77d; font-size:14px; letter-spacing:1px; margin-bottom:12px; }
    .preset-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .preset-button,.action-button {
      padding:10px; border:1px solid rgba(255,255,255,.14); border-radius:8px; color:#fff; background:#223440; cursor:pointer;
    }
    .preset-button:hover,.action-button:hover { border-color:rgba(255,255,255,.38); }
    .field {
      display:grid; grid-template-columns:118px minmax(0,1fr) 48px; align-items:center; gap:9px; margin-bottom:10px;
    }
    .field label,.toggle-field label { font-size:13px; color:rgba(255,255,255,.82); }
    .field output { text-align:right; font-size:12px; color:rgba(255,255,255,.56); }
    input[type="range"] { width:100%; accent-color:#d4ad58; }
    input[type="color"] { width:100%; height:32px; border:0; background:transparent; }
    select { width:100%; padding:9px; border:1px solid rgba(255,255,255,.12); border-radius:7px; color:#fff; background:#192733; }
    .toggle-field { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
    .toggle-field input { width:18px; height:18px; accent-color:#d4ad58; }
    .actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .primary { background:linear-gradient(180deg,#b58a43,#6c4925); }
    #status { min-height:20px; margin-top:10px; color:#9ed7ae; font-size:12px; }
    @media(max-width:900px) {
      body { grid-template-columns:1fr; grid-template-rows:55vh 45vh; }
      #panel { border-left:0; border-top:1px solid rgba(255,255,255,.08); }
      .field { grid-template-columns:102px minmax(0,1fr) 44px; }
      #hint { white-space:normal; width:max-content; max-width:78%; text-align:center; }
    }
  </style>
</head>
<body>
  <main id="viewport">
    <div id="topbar">
      <div class="toolbar-group">
        <button class="toolbar-button" id="front-view">正面</button>
        <button class="toolbar-button" id="side-view">側面</button>
        <button class="toolbar-button" id="back-view">背面</button>
        <button class="toolbar-button" id="toggle-grid">格線</button>
      </div>
      <a class="back-link" href="./index.html">返回遊戲</a>
    </div>
    <div id="hint">左鍵旋轉｜滾輪縮放｜右鍵平移</div>
  </main>

  <aside id="panel">
    <h1>海盜角色編輯器</h1>
    <div class="subtitle">角色造型已升級為更完整的低多邊形海盜。儲存後，遊戲會優先讀取瀏覽器中的角色設定。</div>

    <section class="section">
      <h2>快速預設</h2>
      <div class="preset-grid">
        <button class="preset-button" data-preset="captain">經典船長</button>
        <button class="preset-button" data-preset="rogue">黑帆盜賊</button>
        <button class="preset-button" data-preset="royal">皇家私掠者</button>
        <button class="preset-button" data-preset="reset">重設預設</button>
      </div>
    </section>

    <section class="section">
      <h2>身體比例</h2>
      <div class="field"><label>角色高度</label><input id="height" type="range" min=".75" max="1.35" step=".01" value="1"><output>1.00</output></div>
      <div class="field"><label>身體寬度</label><input id="bodyWidth" type="range" min=".72" max="1.35" step=".01" value="1"><output>1.00</output></div>
      <div class="field"><label>頭部大小</label><input id="headScale" type="range" min=".75" max="1.45" step=".01" value="1"><output>1.00</output></div>
      <div class="field"><label>手臂長度</label><input id="armLength" type="range" min=".75" max="1.35" step=".01" value="1"><output>1.00</output></div>
      <div class="field"><label>腿部長度</label><input id="legLength" type="range" min=".75" max="1.35" step=".01" value="1"><output>1.00</output></div>
    </section>

    <section class="section">
      <h2>配件比例</h2>
      <div class="field"><label>鬍子大小</label><input id="beardScale" type="range" min="0" max="1.5" step=".01" value="1"><output>1.00</output></div>
      <div class="field"><label>帽子大小</label><input id="hatScale" type="range" min=".7" max="1.4" step=".01" value="1"><output>1.00</output></div>
      <div class="field"><label>短劍大小</label><input id="swordScale" type="range" min="0" max="1.4" step=".01" value="1"><output>1.00</output></div>
      <div class="toggle-field"><label>帽子</label><input id="showHat" type="checkbox" checked></div>
      <div class="toggle-field"><label>鬍子</label><input id="showBeard" type="checkbox" checked></div>
      <div class="toggle-field"><label>短劍</label><input id="showSword" type="checkbox" checked></div>
      <div class="toggle-field"><label>眼罩</label><input id="showEyePatch" type="checkbox" checked></div>
      <div class="toggle-field"><label>耳環</label><input id="showEarring" type="checkbox" checked></div>
    </section>

    <section class="section">
      <h2>配色</h2>
      <div class="field"><label>外套</label><input id="coatColor" type="color" value="#7f2632"><output></output></div>
      <div class="field"><label>襯衫</label><input id="shirtColor" type="color" value="#efe5d5"><output></output></div>
      <div class="field"><label>膚色</label><input id="skinColor" type="color" value="#d99a69"><output></output></div>
      <div class="field"><label>皮革</label><input id="leatherColor" type="color" value="#4b2e20"><output></output></div>
      <div class="field"><label>帽子</label><input id="hatColor" type="color" value="#17191d"><output></output></div>
      <div class="field"><label>鬍子</label><input id="beardColor" type="color" value="#3c241b"><output></output></div>
      <div class="field"><label>金屬／飾帶</label><input id="sashColor" type="color" value="#c69b45"><output></output></div>
    </section>

    <section class="section">
      <h2>姿勢預覽</h2>
      <select id="pose">
        <option value="idle">待機</option>
        <option value="walk">走路</option>
        <option value="interact">互動</option>
        <option value="victory">勝利</option>
      </select>
    </section>

    <div class="actions">
      <button class="action-button primary" id="save-browser">儲存至遊戲</button>
      <button class="action-button" id="copy-json">複製 JSON</button>
      <button class="action-button" id="download-json">下載 JSON</button>
      <button class="action-button" id="import-json">匯入 JSON</button>
    </div>
    <input id="json-file" type="file" accept=".json,application/json" hidden>
    <div id="status"></div>
  </aside>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    
function colorDarken(hex, factor) {
  return new THREE.Color(hex).multiplyScalar(factor);
}

function createMat(color, roughness = 0.78, metalness = 0) {
  return new THREE.MeshStandardMaterial({ color, roughness, metalness });
}

function addMesh(parent, geometry, material, position = [0, 0, 0], rotation = [0, 0, 0], scale = [1, 1, 1]) {
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(...position);
  mesh.rotation.set(...rotation);
  mesh.scale.set(...scale);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function createPirateCharacter(config = {}) {
  const c = {
    height: 1,
    bodyWidth: 1,
    headScale: 1,
    armLength: 1,
    legLength: 1,
    beardScale: 1,
    hatScale: 1,
    swordScale: 1,
    coatColor: "#7f2632",
    shirtColor: "#efe5d5",
    skinColor: "#d99a69",
    leatherColor: "#4b2e20",
    hatColor: "#17191d",
    beardColor: "#3c241b",
    sashColor: "#c69b45",
    showHat: true,
    showBeard: true,
    showSword: true,
    showEyePatch: true,
    showEarring: true,
    ...config
  };

  const root = new THREE.Group();
  root.name = "PirateRoot";
  root.scale.set(c.bodyWidth, c.height, 1);

  const materials = {
    coat: createMat(c.coatColor, 0.74),
    coatDark: createMat(colorDarken(c.coatColor, 0.58), 0.82),
    coatLight: createMat(new THREE.Color(c.coatColor).lerp(new THREE.Color("#ffffff"), 0.13), 0.72),
    shirt: createMat(c.shirtColor, 0.9),
    skin: createMat(c.skinColor, 0.84),
    skinDark: createMat(colorDarken(c.skinColor, 0.82), 0.88),
    leather: createMat(c.leatherColor, 0.86),
    leatherDark: createMat(colorDarken(c.leatherColor, 0.48), 0.9),
    hat: createMat(c.hatColor, 0.84),
    beard: createMat(c.beardColor, 0.9),
    gold: createMat(c.sashColor, 0.42, 0.42),
    eye: createMat(0x111318, 0.9),
    white: createMat(0xf7f4ea, 0.95),
    blade: createMat(0xc1cbd0, 0.25, 0.78),
    boot: createMat(0x15171b, 0.88),
    eyebrow: createMat(colorDarken(c.beardColor, 0.72), 0.92)
  };

  const hips = new THREE.Group();
  hips.position.y = 2.04;
  root.add(hips);

  const torso = new THREE.Group();
  torso.position.y = 1.12;
  hips.add(torso);

  // Shirt and chest
  addMesh(torso, new THREE.BoxGeometry(1.16, 1.38, 0.66), materials.shirt, [0, 0.1, 0]);
  addMesh(torso, new THREE.CylinderGeometry(0.28, 0.38, 0.5, 8), materials.shirt, [0, 0.78, 0.05], [0, 0, 0], [1.8, 1, 1.1]);

  // Coat body panels
  addMesh(torso, new THREE.BoxGeometry(0.48, 1.6, 0.82), materials.coat, [-0.46, 0.03, 0.03], [0, 0, 0.07]);
  addMesh(torso, new THREE.BoxGeometry(0.48, 1.6, 0.82), materials.coat, [0.46, 0.03, 0.03], [0, 0, -0.07]);

  // Lapels
  addMesh(torso, new THREE.BoxGeometry(0.22, 0.78, 0.12), materials.coatLight, [-0.23, 0.42, 0.46], [0.04, 0, -0.32]);
  addMesh(torso, new THREE.BoxGeometry(0.22, 0.78, 0.12), materials.coatLight, [0.23, 0.42, 0.46], [0.04, 0, 0.32]);

  // Collar
  addMesh(torso, new THREE.BoxGeometry(0.42, 0.24, 0.22), materials.coatDark, [-0.33, 0.85, 0.02], [0, 0, -0.28]);
  addMesh(torso, new THREE.BoxGeometry(0.42, 0.24, 0.22), materials.coatDark, [0.33, 0.85, 0.02], [0, 0, 0.28]);

  // Coat tails
  const leftTail = addMesh(torso, new THREE.BoxGeometry(0.55, 1.0, 0.72), materials.coat, [-0.34, -1.02, 0.03], [-0.12, 0, 0.08]);
  const rightTail = addMesh(torso, new THREE.BoxGeometry(0.55, 1.0, 0.72), materials.coat, [0.34, -1.02, 0.03], [-0.12, 0, -0.08]);

  // Belt, sash and buckle
  addMesh(torso, new THREE.BoxGeometry(1.42, 0.25, 0.84), materials.leather, [0, -0.58, 0.02]);
  addMesh(torso, new THREE.BoxGeometry(0.38, 0.38, 0.12), materials.gold, [0, -0.58, 0.48]);
  addMesh(torso, new THREE.BoxGeometry(0.18, 2.08, 0.12), materials.gold, [-0.08, 0.08, 0.48], [0, 0, -0.54]);

  // Buttons
  for (const y of [0.44, 0.04, -0.34]) {
    addMesh(torso, new THREE.SphereGeometry(0.075, 8, 6), materials.gold, [0, y, 0.46]);
  }

  // Shoulder pads
  addMesh(torso, new THREE.CylinderGeometry(0.34, 0.38, 0.16, 8), materials.gold, [-0.8, 0.8, 0], [0, 0, Math.PI / 2]);
  addMesh(torso, new THREE.CylinderGeometry(0.34, 0.38, 0.16, 8), materials.gold, [0.8, 0.8, 0], [0, 0, Math.PI / 2]);

  // Head
  const headRoot = new THREE.Group();
  headRoot.position.set(0, 1.58, 0);
  headRoot.scale.setScalar(c.headScale);
  torso.add(headRoot);

  const head = addMesh(headRoot, new THREE.DodecahedronGeometry(0.56, 1), materials.skin);
  head.scale.set(0.94, 1.04, 0.92);

  // Nose
  addMesh(headRoot, new THREE.ConeGeometry(0.13, 0.3, 5), materials.skinDark, [0, -0.03, 0.54], [Math.PI / 2, 0, 0]);

  // Eyes
  addMesh(headRoot, new THREE.SphereGeometry(0.06, 8, 6), materials.eye, [-0.2, 0.12, 0.49]);
  addMesh(headRoot, new THREE.SphereGeometry(0.06, 8, 6), materials.eye, [0.2, 0.12, 0.49]);
  addMesh(headRoot, new THREE.SphereGeometry(0.018, 6, 4), materials.white, [-0.18, 0.14, 0.535]);
  addMesh(headRoot, new THREE.SphereGeometry(0.018, 6, 4), materials.white, [0.22, 0.14, 0.535]);

  // Eyebrows
  addMesh(headRoot, new THREE.BoxGeometry(0.24, 0.055, 0.06), materials.eyebrow, [-0.2, 0.29, 0.49], [0, 0, -0.16]);
  addMesh(headRoot, new THREE.BoxGeometry(0.24, 0.055, 0.06), materials.eyebrow, [0.2, 0.29, 0.49], [0, 0, 0.16]);

  // Ears
  addMesh(headRoot, new THREE.SphereGeometry(0.12, 8, 6), materials.skinDark, [-0.56, 0, 0]);
  addMesh(headRoot, new THREE.SphereGeometry(0.12, 8, 6), materials.skinDark, [0.56, 0, 0]);

  // Eye patch
  const eyePatch = new THREE.Group();
  eyePatch.visible = c.showEyePatch;
  addMesh(eyePatch, new THREE.SphereGeometry(0.16, 10, 8, 0, Math.PI * 2, 0, Math.PI / 2), materials.hat, [0.2, 0.13, 0.47], [Math.PI / 2, 0, 0]);
  addMesh(eyePatch, new THREE.BoxGeometry(0.7, 0.045, 0.04), materials.hat, [0.0, 0.25, 0.48], [0, 0, -0.25]);
  headRoot.add(eyePatch);

  // Earring
  const earring = new THREE.Group();
  earring.visible = c.showEarring;
  addMesh(earring, new THREE.TorusGeometry(0.11, 0.025, 8, 16), materials.gold, [-0.59, -0.06, 0], [0, Math.PI / 2, 0]);
  headRoot.add(earring);

  // Beard and moustache
  const beardGroup = new THREE.Group();
  beardGroup.visible = c.showBeard;
  beardGroup.scale.setScalar(c.beardScale);

  addMesh(beardGroup, new THREE.ConeGeometry(0.48, 0.72, 7), materials.beard, [0, -0.45, 0.18], [0.16, 0, 0]);
  addMesh(beardGroup, new THREE.ConeGeometry(0.1, 0.34, 5), materials.beard, [-0.12, -0.11, 0.53], [Math.PI / 2, 0, -1.05]);
  addMesh(beardGroup, new THREE.ConeGeometry(0.1, 0.34, 5), materials.beard, [0.12, -0.11, 0.53], [Math.PI / 2, 0, 1.05]);
  headRoot.add(beardGroup);

  // Hat
  const hatGroup = new THREE.Group();
  hatGroup.position.y = 0.55;
  hatGroup.scale.setScalar(c.hatScale);
  hatGroup.visible = c.showHat;

  addMesh(hatGroup, new THREE.CylinderGeometry(0.72, 0.82, 0.16, 10), materials.hat);
  addMesh(hatGroup, new THREE.ConeGeometry(0.68, 0.78, 3), materials.hat, [0, 0.38, 0], [0, Math.PI / 2, 0]);
  addMesh(hatGroup, new THREE.BoxGeometry(0.94, 0.11, 0.08), materials.gold, [0, 0.27, 0.49]);
  addMesh(hatGroup, new THREE.SphereGeometry(0.07, 8, 6), materials.gold, [0, 0.28, 0.55]);
  headRoot.add(hatGroup);

  function createArm(side) {
    const armRoot = new THREE.Group();
    armRoot.position.set(side * 0.84, 0.86, 0);
    torso.add(armRoot);

    addMesh(
      armRoot,
      new THREE.CapsuleGeometry(0.23, 0.58 * c.armLength, 4, 8),
      materials.coat,
      [0, -0.43 * c.armLength, 0]
    );

    addMesh(
      armRoot,
      new THREE.CylinderGeometry(0.27, 0.27, 0.18, 8),
      materials.gold,
      [0, -0.82 * c.armLength, 0]
    );

    const forearm = new THREE.Group();
    forearm.position.y = -0.91 * c.armLength;
    armRoot.add(forearm);

    addMesh(
      forearm,
      new THREE.CapsuleGeometry(0.2, 0.48 * c.armLength, 4, 8),
      materials.coatDark,
      [0, -0.34 * c.armLength, 0]
    );

    addMesh(
      forearm,
      new THREE.DodecahedronGeometry(0.22, 0),
      materials.skin,
      [0, -0.74 * c.armLength, 0]
    );

    return { root: armRoot, forearm };
  }

  const leftArm = createArm(-1);
  const rightArm = createArm(1);

  function createLeg(side) {
    const legRoot = new THREE.Group();
    legRoot.position.set(side * 0.35, -0.08, 0);
    hips.add(legRoot);

    addMesh(
      legRoot,
      new THREE.CapsuleGeometry(0.28, 0.64 * c.legLength, 4, 8),
      materials.coatDark,
      [0, -0.52 * c.legLength, 0]
    );

    const shin = new THREE.Group();
    shin.position.y = -0.97 * c.legLength;
    legRoot.add(shin);

    addMesh(
      shin,
      new THREE.CapsuleGeometry(0.24, 0.52 * c.legLength, 4, 8),
      materials.leatherDark,
      [0, -0.37 * c.legLength, 0]
    );

    addMesh(
      shin,
      new THREE.BoxGeometry(0.52, 0.46, 0.86),
      materials.boot,
      [0, -0.82 * c.legLength, 0.18],
      [-0.08, 0, 0]
    );

    addMesh(
      shin,
      new THREE.BoxGeometry(0.56, 0.12, 0.9),
      materials.gold,
      [0, -0.67 * c.legLength, 0.18]
    );

    return { root: legRoot, shin };
  }

  const leftLeg = createLeg(-1);
  const rightLeg = createLeg(1);

  // Sword and sheath
  const swordGroup = new THREE.Group();
  swordGroup.position.set(0.72, 0.15, -0.05);
  swordGroup.rotation.z = -0.28;
  swordGroup.scale.setScalar(c.swordScale);
  swordGroup.visible = c.showSword;

  addMesh(swordGroup, new THREE.BoxGeometry(0.19, 1.35, 0.13), materials.leatherDark, [0, -0.46, -0.02]);
  addMesh(swordGroup, new THREE.BoxGeometry(0.14, 1.25, 0.07), materials.blade, [0, -0.39, 0.05]);
  addMesh(swordGroup, new THREE.BoxGeometry(0.52, 0.12, 0.16), materials.gold, [0, 0.25, 0]);
  addMesh(swordGroup, new THREE.CylinderGeometry(0.08, 0.08, 0.34, 8), materials.leather, [0, 0.43, 0]);
  torso.add(swordGroup);

  root.userData.parts = {
    hips,
    torso,
    headRoot,
    leftArm,
    rightArm,
    leftLeg,
    rightLeg,
    swordGroup,
    hatGroup,
    beardGroup,
    eyePatch,
    earring,
    leftTail,
    rightTail
  };

  return root;
}


    const defaults = {
      height:1, bodyWidth:1, headScale:1, armLength:1, legLength:1,
      beardScale:1, hatScale:1, swordScale:1,
      coatColor:"#7f2632", shirtColor:"#efe5d5", skinColor:"#d99a69",
      leatherColor:"#4b2e20", hatColor:"#17191d", beardColor:"#3c241b",
      sashColor:"#c69b45",
      showHat:true, showBeard:true, showSword:true, showEyePatch:true, showEarring:true,
      pose:"idle"
    };

    const presets = {
      captain: {...defaults},
      rogue: {
        ...defaults, bodyWidth:.94, headScale:.92, beardScale:.55,
        coatColor:"#253544", shirtColor:"#c9d0d2", leatherColor:"#211a18",
        hatColor:"#0c0f12", beardColor:"#1b1716", sashColor:"#9c7b42",
        showEyePatch:true, showEarring:false
      },
      royal: {
        ...defaults, height:1.08, bodyWidth:.92, beardScale:.75,
        coatColor:"#234f78", shirtColor:"#f4efe1", leatherColor:"#5a3724",
        hatColor:"#18283c", beardColor:"#5b3a26", sashColor:"#e1bf67",
        showEyePatch:false, showEarring:true
      }
    };

    let config = (()=>{
      try {
        const saved = localStorage.getItem("pirate-character-config");
        return saved ? {...defaults,...JSON.parse(saved)} : {...defaults};
      } catch {
        return {...defaults};
      }
    })();

    const viewport = document.getElementById("viewport");
    const status = document.getElementById("status");
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x101b24);

    const camera = new THREE.PerspectiveCamera(38,1,.1,100);
    camera.position.set(7.5,5.8,9.5);

    const renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
    renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    viewport.prepend(renderer.domElement);

    const controls = new OrbitControls(camera,renderer.domElement);
    controls.target.set(0,3.1,0);
    controls.enableDamping = true;
    controls.minDistance = 4;
    controls.maxDistance = 18;

    scene.add(new THREE.HemisphereLight(0xdaf6ff,0x3a342d,2.2));
    const key = new THREE.DirectionalLight(0xffedc6,3);
    key.position.set(-5,10,7);
    key.castShadow = true;
    scene.add(key);
    const rim = new THREE.DirectionalLight(0x7fc8ff,1.2);
    rim.position.set(6,5,-5);
    scene.add(rim);

    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(5.5,48),
      new THREE.MeshStandardMaterial({color:0x33454a,roughness:.95})
    );
    floor.rotation.x = -Math.PI/2;
    floor.receiveShadow = true;
    scene.add(floor);

    const grid = new THREE.GridHelper(12,24,0x78919a,0x42545c);
    grid.position.y = .01;
    scene.add(grid);

    let character = null;
    const clock = new THREE.Clock();

    function rebuild() {
      if (character) scene.remove(character);
      character = createPirateCharacter(config);
      scene.add(character);
    }

    function syncUI() {
      for (const [key,value] of Object.entries(config)) {
        const el = document.getElementById(key);
        if (!el) continue;
        if (el.type === "checkbox") el.checked = !!value;
        else el.value = value;
        const out = el.parentElement?.querySelector("output");
        if (out && el.type === "range") out.textContent = Number(value).toFixed(2);
      }
    }

    const editableKeys = Object.keys(defaults);
    for (const key of editableKeys) {
      const el = document.getElementById(key);
      if (!el) continue;
      el.addEventListener("input",()=>{
        config[key] = el.type === "range" ? Number(el.value) : el.type === "checkbox" ? el.checked : el.value;
        const out = el.parentElement?.querySelector("output");
        if (out && el.type === "range") out.textContent = Number(el.value).toFixed(2);
        rebuild();
      });
    }

    document.querySelectorAll("[data-preset]").forEach(button=>{
      button.addEventListener("click",()=>{
        const name = button.dataset.preset;
        config = name === "reset" ? {...defaults} : {...presets[name]};
        syncUI();
        rebuild();
        setStatus(`已套用：${button.textContent}`);
      });
    });

    function applyPose(t) {
      if (!character) return;
      const p = character.userData.parts;
      const reset = o=>o.rotation.set(0,0,0);
      [p.leftArm.root,p.rightArm.root,p.leftArm.forearm,p.rightArm.forearm,p.leftLeg.root,p.rightLeg.root,p.torso,p.headRoot].forEach(reset);
      p.torso.position.y = 0;

      if (config.pose === "walk") {
        const s = Math.sin(t*5.5)*.75;
        p.leftArm.root.rotation.x=s; p.rightArm.root.rotation.x=-s;
        p.leftLeg.root.rotation.x=-s*.85; p.rightLeg.root.rotation.x=s*.85;
        p.torso.rotation.z=Math.sin(t*5.5)*.03;
        p.torso.position.y=Math.abs(Math.sin(t*5.5))*.05;
      } else if (config.pose === "interact") {
        p.rightArm.root.rotation.x=-1.35;
        p.rightArm.forearm.rotation.x=-.55;
        p.headRoot.rotation.y=-.16;
      } else if (config.pose === "victory") {
        p.rightArm.root.rotation.x=-2.35;
        p.leftArm.root.rotation.x=-1.1;
        p.torso.rotation.z=Math.sin(t*4)*.05;
      } else {
        p.torso.position.y=Math.sin(t*2)*.025;
        p.headRoot.rotation.y=Math.sin(t*.8)*.06;
      }
    }

    function setStatus(text,error=false) {
      status.textContent=text;
      status.style.color=error?"#ef9a9a":"#9ed7ae";
    }

    document.getElementById("save-browser").onclick=()=>{
      localStorage.setItem("pirate-character-config",JSON.stringify(config));
      setStatus("已儲存。返回遊戲並重新整理即可套用。");
    };

    document.getElementById("copy-json").onclick=async()=>{
      try {
        await navigator.clipboard.writeText(JSON.stringify(config,null,2));
        setStatus("JSON 已複製");
      } catch {
        setStatus("瀏覽器禁止複製",true);
      }
    };

    document.getElementById("download-json").onclick=()=>{
      const blob=new Blob([JSON.stringify(config,null,2)],{type:"application/json"});
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");
      a.href=url; a.download="pirate-character.json"; a.click();
      URL.revokeObjectURL(url);
      setStatus("已下載 JSON");
    };

    const fileInput=document.getElementById("json-file");
    document.getElementById("import-json").onclick=()=>fileInput.click();
    fileInput.addEventListener("change",async()=>{
      const file=fileInput.files?.[0];
      if(!file)return;
      try {
        const imported=JSON.parse(await file.text());
        config={...defaults,...imported};
        syncUI(); rebuild(); setStatus("JSON 匯入完成");
      } catch {
        setStatus("JSON 格式錯誤",true);
      }
      fileInput.value="";
    });

    function setView(x,y,z) {
      camera.position.set(x,y,z);
      controls.target.set(0,3.1,0);
      controls.update();
    }
    document.getElementById("front-view").onclick=()=>setView(0,4.3,9);
    document.getElementById("side-view").onclick=()=>setView(9,4.3,0);
    document.getElementById("back-view").onclick=()=>setView(0,4.3,-9);
    document.getElementById("toggle-grid").onclick=()=>grid.visible=!grid.visible;

    function resize() {
      const r=viewport.getBoundingClientRect();
      renderer.setSize(r.width,r.height,false);
      camera.aspect=r.width/r.height;
      camera.updateProjectionMatrix();
    }
    addEventListener("resize",resize);
    syncUI();
    rebuild();
    resize();

    function loop() {
      requestAnimationFrame(loop);
      applyPose(clock.getElapsedTime());
      controls.update();
      renderer.render(scene,camera);
    }
    loop();
  </script>
</body>
</html>
