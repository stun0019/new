<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Pirate Adventure V0.4</title>
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #071018;
      touch-action: none;
      overscroll-behavior: none;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    button { font: inherit; }
    #game-wrapper {
      position: relative;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      max-width: 1280px;
      max-height: 720px;
      overflow: hidden;
      background: #0e2933;
      box-shadow: 0 0 0 1px rgba(255,255,255,.04), 0 28px 80px rgba(0,0,0,.48);
    }
    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }
    #debug-editor-button {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 950;
      padding: 8px 12px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 7px;
      color: rgba(255,255,255,.88);
      background: rgba(10,20,28,.72);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      backdrop-filter: blur(7px);
    }
    #debug-editor-button:hover {
      border-color: rgba(255,255,255,.55);
      background: rgba(31,51,64,.94);
    }
    #orientation-screen,
    #loading-page,
    #stage-intro,
    #complete-screen {
      position: absolute;
      inset: 0;
    }
    #orientation-screen {
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      background: radial-gradient(circle at center, #173442 0%, #071018 74%);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .55s ease, visibility .55s ease;
    }
    #orientation-screen.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
    .orientation-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      padding: 28px;
      text-align: center;
    }
    .phone-rotate-icon {
      position: relative;
      width: 70px;
      height: 116px;
      border: 4px solid rgba(255,255,255,.92);
      border-radius: 14px;
      animation: phoneRotate 2.2s ease-in-out infinite;
    }
    .phone-rotate-icon::after {
      content: "↻";
      position: absolute;
      top: 50%;
      left: 100%;
      margin-left: 18px;
      font-size: 44px;
      transform: translateY(-50%);
    }
    .orientation-title { font-size: clamp(24px,6vw,38px); font-weight: 800; }
    .orientation-subtitle { margin-top: 9px; color: rgba(255,255,255,.66); }
    @keyframes phoneRotate {
      0%,100% { transform: rotate(-18deg); }
      50% { transform: rotate(72deg); }
    }
    #loading-page {
      z-index: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 40%, rgba(46,92,104,.68) 0%, rgba(11,28,36,.98) 50%, #060d13 100%);
      transition: opacity .75s ease, visibility .75s ease;
    }
    #loading-page.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    #loading-page::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .12;
      background-image:
        linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
      background-size: 48px 48px;
      animation: gridMove 10s linear infinite;
    }
    @keyframes gridMove { to { background-position: 48px 48px; } }
    .loading-content {
      position: relative;
      z-index: 2;
      width: min(78%,560px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .game-logo { margin-bottom: 48px; }
    .logo-main {
      display: block;
      color: #f7f5ed;
      font-size: clamp(42px,7vw,86px);
      font-weight: 900;
      letter-spacing: clamp(6px,1.1vw,14px);
      text-shadow: 0 4px 0 rgba(0,0,0,.42), 0 14px 32px rgba(0,0,0,.62);
    }
    .logo-sub {
      display: block;
      margin-top: 5px;
      color: rgba(214,222,220,.72);
      font-size: clamp(13px,1.8vw,22px);
      font-weight: 700;
      letter-spacing: clamp(8px,1.5vw,18px);
    }
    #loading-status {
      width: 100%;
      transition: opacity .4s ease, transform .4s ease;
    }
    #loading-status.hidden {
      opacity: 0;
      transform: translateY(-10px);
    }
    .loading-text {
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      color: rgba(255,255,255,.78);
      font-size: clamp(13px,1.8vw,18px);
    }
    #progress-track {
      width: 100%;
      height: clamp(12px,1.7vw,18px);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.24);
      border-radius: 999px;
      background: rgba(0,0,0,.36);
    }
    #progress-bar {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg,#b48a45,#f0d78a,#bd9149);
      transition: width .12s linear;
    }
    #start-game-button {
      position: absolute;
      top: calc(100% - 68px);
      min-width: 220px;
      padding: 15px 34px;
      border: 1px solid rgba(255,255,255,.42);
      border-radius: 8px;
      color: #fff;
      background: linear-gradient(180deg,rgba(178,135,69,.97),rgba(92,61,31,.99));
      font-size: clamp(17px,2.2vw,24px);
      font-weight: 800;
      letter-spacing: 3px;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transform: translateY(16px);
      transition: .6s ease;
    }
    #start-game-button.visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }
    #stage-intro {
      z-index: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      background: rgba(0,0,0,.58);
      opacity: 0;
      visibility: hidden;
      transition: opacity .45s ease, visibility .45s ease;
    }
    #stage-intro.visible { opacity: 1; visibility: visible; }
    #stage-intro.fade-out { opacity: 0; }
    #stage-intro-title {
      font-size: clamp(44px,7vw,88px);
      font-weight: 900;
      letter-spacing: clamp(7px,1.5vw,18px);
    }
    #stage-intro-subtitle {
      margin-top: 10px;
      color: rgba(255,255,255,.74);
      font-size: clamp(18px,2.6vw,32px);
      font-weight: 700;
      letter-spacing: 5px;
    }
    #hud {
      position: absolute;
      inset: 0;
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: .45s ease;
    }
    #hud.visible { opacity: 1; visibility: visible; }
    #mission-panel {
      position: absolute;
      top: 22px;
      left: 24px;
      max-width: 420px;
      padding: 13px 17px;
      border-left: 4px solid rgba(235,196,105,.92);
      color: #fff;
      background: linear-gradient(90deg,rgba(5,18,25,.82),rgba(5,18,25,.28));
      opacity: 0;
      transform: translateX(-14px);
      transition: .5s ease;
    }
    #mission-panel.visible { opacity: 1; transform: translateX(0); }
    #mission-label {
      margin-bottom: 4px;
      color: rgba(239,205,122,.94);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 3px;
    }
    #mission-text {
      font-size: clamp(14px,1.6vw,20px);
      font-weight: 700;
    }
    #desktop-help {
      position: absolute;
      top: 20px;
      left: 50%;
      padding: 9px 15px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 7px;
      color: rgba(255,255,255,.7);
      background: rgba(5,18,25,.5);
      transform: translateX(-50%);
      backdrop-filter: blur(6px);
    }
    #interaction-prompt {
      position: absolute;
      left: 50%;
      bottom: 56px;
      min-width: 240px;
      padding: 12px 20px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 999px;
      color: #fff;
      background: rgba(4,16,23,.82);
      font-weight: 800;
      text-align: center;
      opacity: 0;
      transform: translateX(-50%) translateY(10px);
      transition: .18s ease;
    }
    #interaction-prompt.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    #toast-message {
      position: absolute;
      left: 50%;
      top: 98px;
      max-width: 560px;
      padding: 13px 22px;
      border-radius: 9px;
      color: #fff;
      background: rgba(4,16,23,.86);
      font-weight: 800;
      text-align: center;
      opacity: 0;
      transform: translateX(-50%) translateY(-10px);
      transition: .25s ease;
    }
    #toast-message.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    #touch-controls {
      position: absolute;
      inset: 0;
      z-index: 200;
      display: none;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    #touch-controls.visible { opacity: 1; visibility: visible; }
    #joystick-zone {
      position: absolute;
      left: max(22px, calc(var(--safe-left) + 16px));
      bottom: max(20px, calc(var(--safe-bottom) + 14px));
      width: 150px;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }
    #joystick-base {
      position: relative;
      width: 124px;
      height: 124px;
      border: 2px solid rgba(255,255,255,.17);
      border-radius: 50%;
      background: rgba(4,17,24,.28);
    }
    #joystick-stick {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 58px;
      height: 58px;
      border: 2px solid rgba(255,255,255,.24);
      border-radius: 50%;
      background: radial-gradient(circle at 36% 30%,rgba(255,255,255,.24),rgba(18,47,56,.65));
      transform: translate(-50%,-50%);
    }
    #interaction-button {
      position: absolute;
      right: max(34px, calc(var(--safe-right) + 24px));
      bottom: max(42px, calc(var(--safe-bottom) + 28px));
      width: 92px;
      height: 92px;
      border: 2px solid rgba(255,255,255,.25);
      border-radius: 50%;
      color: #fff;
      background: radial-gradient(circle at 35% 28%,rgba(191,151,79,.88),rgba(73,47,26,.86));
      font-size: 17px;
      font-weight: 900;
      pointer-events: auto;
    }
    #complete-screen {
      z-index: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      background: rgba(3,12,18,.84);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: .55s ease;
    }
    #complete-screen.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
    #complete-title {
      font-size: clamp(42px,7vw,86px);
      font-weight: 900;
      letter-spacing: clamp(7px,1.4vw,18px);
    }
    #complete-subtitle {
      margin-top: 14px;
      color: rgba(255,255,255,.72);
      font-size: clamp(18px,2.4vw,30px);
      font-weight: 700;
    }
    #restart-button {
      margin-top: 22px;
      min-width: 190px;
      padding: 14px 28px;
      border: 1px solid rgba(255,255,255,.38);
      border-radius: 8px;
      color: #fff;
      background: linear-gradient(180deg,#b08446,#5b3b22);
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
    }
    @media (pointer: coarse), (max-width: 900px) {
      #touch-controls { display: block; }
      #desktop-help { display: none; }
      #mission-panel { top: 15px; left: 17px; max-width: 330px; }
      #interaction-prompt { bottom: 152px; }
      #debug-editor-button { top: 10px; right: 10px; }
    }
    @media (pointer: fine) and (hover: hover) {
      #touch-controls { display: none !important; }
    }
  </style>
</head>
<body>
  <main id="game-wrapper">
    <canvas id="game-canvas" width="1280" height="720" tabindex="0"></canvas>
    <button id="debug-editor-button" type="button">DEBUG</button>

    <section id="orientation-screen">
      <div class="orientation-content">
        <div class="phone-rotate-icon"></div>
        <div>
          <div class="orientation-title">請將手機轉為橫向</div>
          <div class="orientation-subtitle">橫向模式可獲得最佳遊戲體驗</div>
        </div>
      </div>
    </section>

    <section id="loading-page">
      <div class="loading-content">
        <div class="game-logo">
          <span class="logo-main">PIRATE</span>
          <span class="logo-sub">ADVENTURE</span>
        </div>
        <div id="loading-status">
          <div class="loading-text">
            <span id="loading-message">正在確認航行路線……</span>
            <span id="progress-number">0%</span>
          </div>
          <div id="progress-track"><div id="progress-bar"></div></div>
        </div>
        <button id="start-game-button" type="button">開始冒險</button>
      </div>
    </section>

    <section id="stage-intro">
      <div id="stage-intro-title">CHAPTER 1</div>
      <div id="stage-intro-subtitle">寶藏島</div>
    </section>

    <section id="hud">
      <div id="mission-panel">
        <div id="mission-label">MISSION 1 / 5</div>
        <div id="mission-text">調查海岸邊的擱淺船</div>
      </div>
      <div id="desktop-help">WASD／方向鍵移動｜E／Space 互動</div>
      <div id="toast-message"></div>
      <div id="interaction-prompt">按 E 互動</div>
    </section>

    <section id="touch-controls">
      <div id="joystick-zone">
        <div id="joystick-base"><div id="joystick-stick"></div></div>
      </div>
      <button id="interaction-button" type="button">互動</button>
    </section>

    <section id="complete-screen">
      <div id="complete-title">CHAPTER COMPLETE</div>
      <div id="complete-subtitle">寶藏島探索完成</div>
      <button id="restart-button" type="button">再次遊玩</button>
    </section>
  </main>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

    
function colorDarken(hex, factor) {
  return new THREE.Color(hex).multiplyScalar(factor);
}

function createMat(color, roughness = 0.78, metalness = 0) {
  return new THREE.MeshStandardMaterial({ color, roughness, metalness });
}

function addMesh(parent, geometry, material, position = [0, 0, 0], rotation = [0, 0, 0], scale = [1, 1, 1]) {
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(...position);
  mesh.rotation.set(...rotation);
  mesh.scale.set(...scale);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function createPirateCharacter(config = {}) {
  const c = {
    height: 1,
    bodyWidth: 1,
    headScale: 1,
    armLength: 1,
    legLength: 1,
    beardScale: 1,
    hatScale: 1,
    swordScale: 1,
    coatColor: "#7f2632",
    shirtColor: "#efe5d5",
    skinColor: "#d99a69",
    leatherColor: "#4b2e20",
    hatColor: "#17191d",
    beardColor: "#3c241b",
    sashColor: "#c69b45",
    showHat: true,
    showBeard: true,
    showSword: true,
    showEyePatch: true,
    showEarring: true,
    ...config
  };

  const root = new THREE.Group();
  root.name = "PirateRoot";
  root.scale.set(c.bodyWidth, c.height, 1);

  const materials = {
    coat: createMat(c.coatColor, 0.74),
    coatDark: createMat(colorDarken(c.coatColor, 0.58), 0.82),
    coatLight: createMat(new THREE.Color(c.coatColor).lerp(new THREE.Color("#ffffff"), 0.13), 0.72),
    shirt: createMat(c.shirtColor, 0.9),
    skin: createMat(c.skinColor, 0.84),
    skinDark: createMat(colorDarken(c.skinColor, 0.82), 0.88),
    leather: createMat(c.leatherColor, 0.86),
    leatherDark: createMat(colorDarken(c.leatherColor, 0.48), 0.9),
    hat: createMat(c.hatColor, 0.84),
    beard: createMat(c.beardColor, 0.9),
    gold: createMat(c.sashColor, 0.42, 0.42),
    eye: createMat(0x111318, 0.9),
    white: createMat(0xf7f4ea, 0.95),
    blade: createMat(0xc1cbd0, 0.25, 0.78),
    boot: createMat(0x15171b, 0.88),
    eyebrow: createMat(colorDarken(c.beardColor, 0.72), 0.92)
  };

  const hips = new THREE.Group();
  hips.position.y = 2.04;
  root.add(hips);

  const torso = new THREE.Group();
  torso.position.y = 1.12;
  hips.add(torso);

  // Shirt and chest
  addMesh(torso, new THREE.BoxGeometry(1.16, 1.38, 0.66), materials.shirt, [0, 0.1, 0]);
  addMesh(torso, new THREE.CylinderGeometry(0.28, 0.38, 0.5, 8), materials.shirt, [0, 0.78, 0.05], [0, 0, 0], [1.8, 1, 1.1]);

  // Coat body panels
  addMesh(torso, new THREE.BoxGeometry(0.48, 1.6, 0.82), materials.coat, [-0.46, 0.03, 0.03], [0, 0, 0.07]);
  addMesh(torso, new THREE.BoxGeometry(0.48, 1.6, 0.82), materials.coat, [0.46, 0.03, 0.03], [0, 0, -0.07]);

  // Lapels
  addMesh(torso, new THREE.BoxGeometry(0.22, 0.78, 0.12), materials.coatLight, [-0.23, 0.42, 0.46], [0.04, 0, -0.32]);
  addMesh(torso, new THREE.BoxGeometry(0.22, 0.78, 0.12), materials.coatLight, [0.23, 0.42, 0.46], [0.04, 0, 0.32]);

  // Collar
  addMesh(torso, new THREE.BoxGeometry(0.42, 0.24, 0.22), materials.coatDark, [-0.33, 0.85, 0.02], [0, 0, -0.28]);
  addMesh(torso, new THREE.BoxGeometry(0.42, 0.24, 0.22), materials.coatDark, [0.33, 0.85, 0.02], [0, 0, 0.28]);

  // Coat tails
  const leftTail = addMesh(torso, new THREE.BoxGeometry(0.55, 1.0, 0.72), materials.coat, [-0.34, -1.02, 0.03], [-0.12, 0, 0.08]);
  const rightTail = addMesh(torso, new THREE.BoxGeometry(0.55, 1.0, 0.72), materials.coat, [0.34, -1.02, 0.03], [-0.12, 0, -0.08]);

  // Belt, sash and buckle
  addMesh(torso, new THREE.BoxGeometry(1.42, 0.25, 0.84), materials.leather, [0, -0.58, 0.02]);
  addMesh(torso, new THREE.BoxGeometry(0.38, 0.38, 0.12), materials.gold, [0, -0.58, 0.48]);
  addMesh(torso, new THREE.BoxGeometry(0.18, 2.08, 0.12), materials.gold, [-0.08, 0.08, 0.48], [0, 0, -0.54]);

  // Buttons
  for (const y of [0.44, 0.04, -0.34]) {
    addMesh(torso, new THREE.SphereGeometry(0.075, 8, 6), materials.gold, [0, y, 0.46]);
  }

  // Shoulder pads
  addMesh(torso, new THREE.CylinderGeometry(0.34, 0.38, 0.16, 8), materials.gold, [-0.8, 0.8, 0], [0, 0, Math.PI / 2]);
  addMesh(torso, new THREE.CylinderGeometry(0.34, 0.38, 0.16, 8), materials.gold, [0.8, 0.8, 0], [0, 0, Math.PI / 2]);

  // Head
  const headRoot = new THREE.Group();
  headRoot.position.set(0, 1.58, 0);
  headRoot.scale.setScalar(c.headScale);
  torso.add(headRoot);

  const head = addMesh(headRoot, new THREE.DodecahedronGeometry(0.56, 1), materials.skin);
  head.scale.set(0.94, 1.04, 0.92);

  // Nose
  addMesh(headRoot, new THREE.ConeGeometry(0.13, 0.3, 5), materials.skinDark, [0, -0.03, 0.54], [Math.PI / 2, 0, 0]);

  // Eyes
  addMesh(headRoot, new THREE.SphereGeometry(0.06, 8, 6), materials.eye, [-0.2, 0.12, 0.49]);
  addMesh(headRoot, new THREE.SphereGeometry(0.06, 8, 6), materials.eye, [0.2, 0.12, 0.49]);
  addMesh(headRoot, new THREE.SphereGeometry(0.018, 6, 4), materials.white, [-0.18, 0.14, 0.535]);
  addMesh(headRoot, new THREE.SphereGeometry(0.018, 6, 4), materials.white, [0.22, 0.14, 0.535]);

  // Eyebrows
  addMesh(headRoot, new THREE.BoxGeometry(0.24, 0.055, 0.06), materials.eyebrow, [-0.2, 0.29, 0.49], [0, 0, -0.16]);
  addMesh(headRoot, new THREE.BoxGeometry(0.24, 0.055, 0.06), materials.eyebrow, [0.2, 0.29, 0.49], [0, 0, 0.16]);

  // Ears
  addMesh(headRoot, new THREE.SphereGeometry(0.12, 8, 6), materials.skinDark, [-0.56, 0, 0]);
  addMesh(headRoot, new THREE.SphereGeometry(0.12, 8, 6), materials.skinDark, [0.56, 0, 0]);

  // Eye patch
  const eyePatch = new THREE.Group();
  eyePatch.visible = c.showEyePatch;

    function createPlayer() {
      const saved = localStorage.getItem("pirate-character-config");

    function configureModel(model) {
      model.traverse(child => {
        if (!child.isMesh) return;
        child.castShadow = true;
        child.receiveShadow = true;
      });
    }

    function loadModel(file, position, rotationY = 0, scale = 1) {
      return new Promise((resolve, reject) => {
        loader.load(MODEL_BASE_PATH + file, gltf => {
          const model = gltf.scene;
          configureModel(model);
          model.position.copy(position);
          model.rotation.y = rotationY;
          model.scale.setScalar(scale);
          scene.add(model);
          resolve(model);
        }, undefined, reject);
      });
    }

    function fallbackObject(position, color, size) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(...size), new THREE.MeshStandardMaterial({color, roughness:.85}));
      m.position.copy(position);
      m.castShadow = true;
      scene.add(m);
      return m;
    }

    function markerFor(object) {
      const marker = new THREE.Group();
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(.75,.07,10,28),
        new THREE.MeshBasicMaterial({color:0xf2d271,transparent:true,opacity:.8})
      );
      ring.rotation.x = Math.PI/2;
      marker.add(ring);
      const beam = new THREE.Mesh(
        new THREE.CylinderGeometry(.08,.25,2.4,10,1,true),
        new THREE.MeshBasicMaterial({color:0xf2d271,transparent:true,opacity:.2,side:THREE.DoubleSide})
      );
      beam.position.y = 1.2;
      marker.add(beam);
      marker.visible = false;
      object.add(marker);
      object.userData.marker = marker;
    }

    function register(object, type, label) {
      object.userData.type = type;
      object.userData.label = label;
      object.userData.active = true;
      markerFor(object);
      world.interactables.push(object);
    }

    function updateMissionUI() {
      const mission = missions[state.missionIndex];
      if (!mission) return;
      missionLabel.textContent = `MISSION ${state.missionIndex+1} / ${missions.length}`;
      missionText.textContent = mission.id === "supplies"
        ? `${mission.text} ${state.supplies}/${mission.required}`
        : mission.text;
      for (const object of world.interactables) {
        if (object.userData.marker) {
          object.userData.marker.visible = object.userData.active && object.userData.type === mission.target;
        }
      }
    }

    function currentMovement() {
      let x = (input.right?1:0) - (input.left?1:0) + input.joyX;
      let z = (input.down?1:0) - (input.up?1:0) + input.joyY;
      const v = new THREE.Vector2(x,z);
      if (v.length()>1) v.normalize();
      return v;
    }

    function animatePlayer(delta) {
      if (!world.player || !state.inputEnabled) return;
      const v = currentMovement();
      const parts = world.player.userData.parts;
      const moving = v.length() > .04;

      if (moving) {
        world.player.position.x += v.x * PLAYER_SPEED * delta;
        world.player.position.z += v.y * PLAYER_SPEED * delta;
        const target = Math.atan2(v.x,v.y);
        world.player.rotation.y += ((((target-world.player.rotation.y)+Math.PI)%(Math.PI*2))-Math.PI) * Math.min(1,delta*12);
      }

      const n = Math.sqrt((world.player.position.x**2)/(14.7**2)+(world.player.position.z**2)/(10.5**2));
      if (n>1) {
        world.player.position.x /= n;
        world.player.position.z /= n;
      }

      const t = clock.elapsedTime;
      if (moving) {
        const s = Math.sin(t*9)*.72;
        parts.leftArm.root.rotation.x = s;
        parts.rightArm.root.rotation.x = -s;
        parts.leftLeg.root.rotation.x = -s*.82;
        parts.rightLeg.root.rotation.x = s*.82;
        parts.torso.rotation.z = Math.sin(t*9)*.025;
        world.player.position.y = PLAYER_BASE_Y + Math.abs(Math.sin(t*9))*.08;
      } else {
        parts.leftArm.root.rotation.x = THREE.MathUtils.lerp(parts.leftArm.root.rotation.x,.05+Math.sin(t*2.2)*.025,delta*7);
        parts.rightArm.root.rotation.x = THREE.MathUtils.lerp(parts.rightArm.root.rotation.x,-.05-Math.sin(t*2.2)*.025,delta*7);
        parts.leftLeg.root.rotation.x = THREE.MathUtils.lerp(parts.leftLeg.root.rotation.x,0,delta*8);
        parts.rightLeg.root.rotation.x = THREE.MathUtils.lerp(parts.rightLeg.root.rotation.x,0,delta*8);
        parts.torso.rotation.z = THREE.MathUtils.lerp(parts.torso.rotation.z,0,delta*8);
        world.player.position.y = THREE.MathUtils.lerp(world.player.position.y,PLAYER_BASE_Y+Math.sin(t*2.2)*.025,delta*6);
      }
      parts.headRoot.rotation.y = Math.sin(t*.8)*.06;

      if (state.interactionTimer>0) {
        state.interactionTimer -= delta;
        parts.rightArm.root.rotation.x = -1.25;
        parts.rightArm.forearm.rotation.x = -.5;
      } else {
        parts.rightArm.forearm.rotation.x = THREE.MathUtils.lerp(parts.rightArm.forearm.rotation.x,0,delta*9);
      }

      if (state.victoryTimer>0) {
        state.victoryTimer -= delta;
        parts.rightArm.root.rotation.x = -2.3;
        parts.leftArm.root.rotation.x = -1.1;
      }
    }

    function interact() {
      const object = state.currentInteractable;
      if (!object) {
        showToast("附近沒有可以互動的物件");
        return;
      }
      const mission = missions[state.missionIndex];
      state.interactionTimer = .45;

      if (object.userData.type !== mission.target) {
        showToast("請先完成目前任務");
        return;
      }

      if (mission.id === "supplies") {
        object.userData.active = false;
        object.visible = false;
        state.supplies += 1;
        showToast(`取得航海物資 ${state.supplies}/3`);
        updateMissionUI();
        if (state.supplies >= 3) setTimeout(advanceMission,450);
        return;
      }

      if (mission.id === "wreck") showToast("找到船長日誌：寶藏藏在島嶼深處");
      if (mission.id === "cannon") showToast("岸防砲修復完成，寶藏區已解鎖");
      if (mission.id === "chest") showToast("取得古老金幣 × 100、失落羅盤 × 1");
      if (mission.id === "ship") {
        completeChapter();
        return;
      }
      advanceMission();
    }

    function advanceMission() {
      state.missionIndex += 1;
      updateMissionUI();
      const mission = missions[state.missionIndex];
      if (mission) setTimeout(()=>showToast(`新任務：${mission.text}`),300);
    }

    function completeChapter() {
      state.inputEnabled = false;
      state.victoryTimer = 2;
      touchControls.classList.remove("visible");
      completeScreen.classList.add("visible");
    }

    function showToast(text) {
      toastMessage.textContent = text;
      toastMessage.classList.add("visible");
      clearTimeout(state.toastTimer);
      state.toastTimer = setTimeout(()=>toastMessage.classList.remove("visible"),2200);
    }

    function updateInteraction() {
      if (!state.inputEnabled) return;
      state.currentInteractable = null;
      let nearest = Infinity;
      for (const object of world.interactables) {
        if (!object.userData.active || !object.visible) continue;
        const d = world.player.position.distanceTo(object.position);
        if (d < nearest && d <= INTERACTION_DISTANCE) {
          nearest = d;
          state.currentInteractable = object;
        }
        if (object.userData.marker?.visible) {
          object.userData.marker.rotation.y += .025;
          object.userData.marker.position.y = Math.sin(clock.elapsedTime*2.2)*.16;
        }
      }
      if (state.currentInteractable) {
        interactionPrompt.textContent = `${matchMedia("(pointer:coarse)").matches?"點擊互動":"按 E"}：${state.currentInteractable.userData.label}`;
        interactionPrompt.classList.add("visible");
      } else interactionPrompt.classList.remove("visible");

      if (input.interact) {
        input.interact = false;
        interact();
      }
    }

    function updateCamera(delta) {
      if (!world.player) return;
      const target = new THREE.Vector3(world.player.position.x+15,19,world.player.position.z+20);
      camera.position.lerp(target,Math.min(1,delta*3.4));
      camera.lookAt(world.player.position.x,2.8,world.player.position.z-1.8);
    }

    function bindInput() {
      const map = {
        KeyW:"up",ArrowUp:"up",KeyS:"down",ArrowDown:"down",
        KeyA:"left",ArrowLeft:"left",KeyD:"right",ArrowRight:"right"
      };
      addEventListener("keydown",e=>{
        if (map[e.code]) { input[map[e.code]]=true; e.preventDefault(); }
        if (e.code==="KeyE" || e.code==="Space") { input.interact=true; e.preventDefault(); }
      });
      addEventListener("keyup",e=>{ if (map[e.code]) input[map[e.code]]=false; });

      let pointer = null;
      const resetJoy = ()=>{ input.joyX=0; input.joyY=0; joystickStick.style.transform="translate(-50%,-50%)"; };
      const updateJoy = e=>{
        const r=joystickZone.getBoundingClientRect();
        const dx=e.clientX-(r.left+r.width/2), dy=e.clientY-(r.top+r.height/2);
        const max=r.width*.28, dist=Math.min(Math.hypot(dx,dy),max), a=Math.atan2(dy,dx);
        const x=Math.cos(a)*dist, y=Math.sin(a)*dist;
        input.joyX=x/max; input.joyY=y/max;
        joystickStick.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px))`;
      };
      joystickZone.addEventListener("pointerdown",e=>{pointer=e.pointerId;joystickZone.setPointerCapture(pointer);updateJoy(e);});
      joystickZone.addEventListener("pointermove",e=>{if(e.pointerId===pointer)updateJoy(e);});
      joystickZone.addEventListener("pointerup",()=>{pointer=null;resetJoy();});
      joystickZone.addEventListener("pointercancel",()=>{pointer=null;resetJoy();});
      interactionButton.addEventListener("pointerdown",()=>input.interact=true);
    }

    function updateOrientation() {
      document.getElementById("orientation-screen").classList.toggle(
        "visible",
        matchMedia("(pointer:coarse)").matches && innerHeight>innerWidth
      );
    }
    addEventListener("resize",updateOrientation);
    updateOrientation();

    startGameButton.addEventListener("click",()=>{
      if (!state.assetsReady || state.started) return;
      state.started = true;
      loadingPage.classList.add("hidden");
      setTimeout(()=>{
        stageIntro.classList.add("visible");
        setTimeout(()=>stageIntro.classList.add("fade-out"),1500);
        setTimeout(()=>{
          stageIntro.classList.remove("visible","fade-out");
          state.inputEnabled = true;
          hud.classList.add("visible");
          missionPanel.classList.add("visible");
          if (matchMedia("(pointer:coarse)").matches) touchControls.classList.add("visible");
          updateMissionUI();
        },2050);
      },420);
    });

    async function init() {
      setProgress(5,"正在建立海上環境……");
      createLights();
      createEnvironment();
      createPlayer();
      setProgress(18,"正在準備寶藏島……");
      await Promise.allSettled([createMissionObjects()]);
      setTimeout(completeLoading,250);
      bindInput();
    }
    init().catch(error=>{console.error(error);completeLoading();});

    function loop() {
      requestAnimationFrame(loop);
      const delta=Math.min(clock.getDelta(),.05);
      animatePlayer(delta);
      updateInteraction();
      updateCamera(delta);
      if (world.water) world.water.position.y=-.68+Math.sin(clock.elapsedTime*.7)*.025;
      if (world.ship) {
        world.ship.position.y=-.22+Math.sin(clock.elapsedTime*1.15)*.16;
        world.ship.rotation.z=Math.sin(clock.elapsedTime*.8)*.018;
      }
      renderer.render(scene,camera);
    }
    loop();
  </script>
</body>
</html>
