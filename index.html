<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="
      width=device-width,
      initial-scale=1,
      maximum-scale=1,
      user-scalable=no,
      viewport-fit=cover
    "
  />

  <title>Pirate Adventure</title>

  <style>
    :root {
      --game-width: 1280;
      --game-height: 720;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #07141d;
      font-family:
        Inter,
        "Noto Sans TC",
        "Microsoft JhengHei",
        Arial,
        sans-serif;
      overscroll-behavior: none;
      touch-action: none;
      user-select: none;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at center, #163544 0%, #07141d 72%);
    }

    /*
      內部遊戲的邏輯尺寸固定為 1280 × 720。
      JavaScript 會依照裝置尺寸進行等比例縮放。
    */
    #game-frame {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1280px;
      height: 720px;
      overflow: hidden;
      background: #54b9d1;
      transform-origin: center center;
      transform: translate(-50%, -50%) scale(1);
    }

    #game-canvas {
      display: block;
      width: 1280px;
      height: 720px;
      outline: none;
    }

    /* ---------------- HUD ---------------- */

    #hud {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    .top-bar {
      position: absolute;
      top: 24px;
      left: 24px;
      right: 24px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
    }

    .status-panel {
      min-width: 260px;
      padding: 14px 18px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 16px;
      color: #ffffff;
      background: rgba(6, 22, 30, 0.68);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.22);
      backdrop-filter: blur(12px);
    }

    .game-title {
      margin-bottom: 6px;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .objective {
      color: rgba(255, 255, 255, 0.78);
      font-size: 14px;
      line-height: 1.5;
    }

    .control-help {
      padding: 12px 15px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 14px;
      color: rgba(255, 255, 255, 0.86);
      background: rgba(6, 22, 30, 0.58);
      font-size: 13px;
      line-height: 1.6;
      text-align: right;
      backdrop-filter: blur(10px);
    }

    #interaction-prompt {
      position: absolute;
      left: 50%;
      bottom: 108px;
      min-width: 230px;
      padding: 12px 20px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      color: #ffffff;
      background: rgba(5, 19, 27, 0.78);
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      opacity: 0;
      transform: translateX(-50%) translateY(12px);
      transition:
        opacity 160ms ease,
        transform 160ms ease;
      backdrop-filter: blur(10px);
    }

    #interaction-prompt.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #message {
      position: absolute;
      left: 50%;
      top: 82px;
      max-width: 520px;
      padding: 13px 22px;
      border-radius: 14px;
      color: #ffffff;
      background: rgba(10, 30, 38, 0.88);
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      opacity: 0;
      transform: translateX(-50%) translateY(-12px);
      transition:
        opacity 180ms ease,
        transform 180ms ease;
      backdrop-filter: blur(10px);
    }

    #message.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ---------------- Loading ---------------- */

    #loading-screen {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(
          160deg,
          rgba(8, 27, 38, 0.98),
          rgba(14, 61, 75, 0.98)
        );
      transition:
        opacity 350ms ease,
        visibility 350ms ease;
    }

    #loading-screen.hidden {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .loading-card {
      width: min(420px, calc(100% - 48px));
      padding: 34px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 22px;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.25);
      text-align: center;
      backdrop-filter: blur(15px);
    }

    .loading-card h1 {
      margin-bottom: 10px;
      font-size: 28px;
      letter-spacing: 0.04em;
    }

    .loading-card p {
      margin-bottom: 22px;
      color: rgba(255, 255, 255, 0.72);
      font-size: 14px;
    }

    .loading-track {
      width: 100%;
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
    }

    #loading-progress {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #f3c767, #ffe8a6);
      transition: width 180ms ease;
    }

    #loading-text {
      margin-top: 12px;
      color: rgba(255, 255, 255, 0.8);
      font-size: 13px;
    }

    /* ---------------- Mobile controls ---------------- */

    #mobile-controls {
      position: absolute;
      inset: 0;
      z-index: 30;
      display: none;
      pointer-events: none;
    }

    #joystick-area {
      position: absolute;
      left: 38px;
      bottom: 32px;
      width: 170px;
      height: 170px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      touch-action: none;
    }

    #joystick-base {
      position: relative;
      width: 144px;
      height: 144px;
      border: 2px solid rgba(255, 255, 255, 0.22);
      border-radius: 50%;
      background: rgba(8, 25, 34, 0.42);
      box-shadow:
        inset 0 0 22px rgba(255, 255, 255, 0.06),
        0 8px 24px rgba(0, 0, 0, 0.18);
      backdrop-filter: blur(8px);
    }

    #joystick-stick {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 66px;
      height: 66px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      background:
        radial-gradient(
          circle at 38% 32%,
          rgba(255, 255, 255, 0.32),
          rgba(20, 55, 67, 0.76)
        );
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.28);
      transform: translate(-50%, -50%);
    }

    #mobile-action-button {
      position: absolute;
      right: 50px;
      bottom: 55px;
      width: 112px;
      height: 112px;
      border: 3px solid rgba(255, 255, 255, 0.32);
      border-radius: 50%;
      color: #17222a;
      background:
        radial-gradient(circle at 36% 28%, #fff1b6, #e7ac42 72%);
      box-shadow:
        0 12px 28px rgba(0, 0, 0, 0.28),
        inset 0 4px 8px rgba(255, 255, 255, 0.42);
      font-family: inherit;
      font-size: 18px;
      font-weight: 900;
      pointer-events: auto;
      touch-action: manipulation;
    }

    #mobile-action-button:active,
    #mobile-action-button.pressed {
      transform: scale(0.93);
      filter: brightness(0.92);
    }

    /* 電腦環境不顯示搖桿與手機互動鍵 */
    @media (pointer: fine) and (hover: hover) {
      #mobile-controls {
        display: none !important;
      }
    }

    /*
      觸控裝置顯示手機操作介面。
      包含手機和平板。
    */
    @media (pointer: coarse), (max-width: 900px) {
      #mobile-controls {
        display: block;
      }

      .control-help {
        display: none;
      }

      .top-bar {
        top: 20px;
        left: 20px;
        right: 20px;
      }

      .status-panel {
        min-width: 0;
        max-width: 360px;
        padding: 12px 15px;
      }

      .game-title {
        font-size: 18px;
      }

      .objective {
        font-size: 13px;
      }

      #interaction-prompt {
        bottom: 178px;
      }
    }
  </style>
</head>

<body>
  <main id="app">
    <section id="game-frame" aria-label="遊戲畫面">
      <canvas id="game-canvas" tabindex="0"></canvas>

      <div id="hud">
        <div class="top-bar">
          <div class="status-panel">
            <div class="game-title">Pirate Adventure</div>
            <div class="objective" id="objective">
              目標：靠近寶箱並進行互動
            </div>
          </div>

          <div class="control-help">
            WASD／方向鍵：移動<br />
            E／Space：互動
          </div>
        </div>

        <div id="message"></div>
        <div id="interaction-prompt">按 E 互動</div>
      </div>

      <div id="mobile-controls">
        <div id="joystick-area" aria-label="虛擬搖桿">
          <div id="joystick-base">
            <div id="joystick-stick"></div>
          </div>
        </div>

        <button
          id="mobile-action-button"
          type="button"
          aria-label="互動"
        >
          互動
        </button>
      </div>

      <div id="loading-screen">
        <div class="loading-card">
          <h1>Pirate Adventure</h1>
          <p>正在載入海盜世界</p>

          <div class="loading-track">
            <div id="loading-progress"></div>
          </div>

          <div id="loading-text">準備場景中……</div>
        </div>
      </div>
    </section>
  </main>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

    /* =========================================================
       基本設定
    ========================================================= */

    const LOGICAL_WIDTH = 1280;
    const LOGICAL_HEIGHT = 720;

    /*
      目前 GitHub 的 pirate 資料夾名稱前面存在空格，
      因此暫時使用 %20。

      資料夾改名為 pirate 後，請改成：
      "./assets/models/pirate/"
    */
    const MODEL_BASE_PATH = "./assets/models/%20pirate/";

    const canvas = document.getElementById("game-canvas");
    const gameFrame = document.getElementById("game-frame");

    const loadingScreen = document.getElementById("loading-screen");
    const loadingProgress = document.getElementById("loading-progress");
    const loadingText = document.getElementById("loading-text");

    const interactionPrompt = document.getElementById(
      "interaction-prompt"
    );

    const messageElement = document.getElementById("message");
    const objectiveElement = document.getElementById("objective");

    const mobileControls = document.getElementById("mobile-controls");
    const joystickArea = document.getElementById("joystick-area");
    const joystickStick = document.getElementById("joystick-stick");
    const actionButton = document.getElementById(
      "mobile-action-button"
    );

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x78cce0);
    scene.fog = new THREE.Fog(0x78cce0, 38, 105);

    const camera = new THREE.PerspectiveCamera(
      46,
      LOGICAL_WIDTH / LOGICAL_HEIGHT,
      0.1,
      300
    );

    camera.position.set(18, 22, 24);

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: false,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio || 1, 2)
    );

    renderer.setSize(LOGICAL_WIDTH, LOGICAL_HEIGHT, false);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;

    const clock = new THREE.Clock();
    const loader = new GLTFLoader();

    const input = {
      forward: false,
      backward: false,
      left: false,
      right: false,
      interactRequested: false,
      joystickX: 0,
      joystickY: 0
    };

    const world = {
      player: null,
      chest: null,
      chestClosed: true,
      currentInteractable: null,
      ship: null,
      water: null
    };

    const interactionDistance = 3.4;

    let messageTimer = null;

    /* =========================================================
       畫面自適應
    ========================================================= */

    function resizeGameFrame() {
      const viewportWidth = window.innerWidth;
      const viewportHeight = window.innerHeight;

      const scale = Math.min(
        viewportWidth / LOGICAL_WIDTH,
        viewportHeight / LOGICAL_HEIGHT
      );

      gameFrame.style.transform =
        `translate(-50%, -50%) scale(${scale})`;
    }

    window.addEventListener("resize", resizeGameFrame);
    window.addEventListener(
      "orientationchange",
      resizeGameFrame
    );

    resizeGameFrame();

    /* =========================================================
       光源
    ========================================================= */

    function createLights() {
      const hemisphereLight = new THREE.HemisphereLight(
        0xc9f4ff,
        0x405a32,
        2.1
      );

      scene.add(hemisphereLight);

      const sunlight = new THREE.DirectionalLight(
        0xfff2cf,
        3.4
      );

      sunlight.position.set(-18, 32, 14);
      sunlight.castShadow = true;

      sunlight.shadow.mapSize.set(2048, 2048);
      sunlight.shadow.camera.left = -38;
      sunlight.shadow.camera.right = 38;
      sunlight.shadow.camera.top = 38;
      sunlight.shadow.camera.bottom = -38;
      sunlight.shadow.camera.near = 1;
      sunlight.shadow.camera.far = 90;

      scene.add(sunlight);
    }

    /* =========================================================
       場景
    ========================================================= */

    function createWater() {
      const geometry = new THREE.PlaneGeometry(220, 220, 1, 1);

      const material = new THREE.MeshStandardMaterial({
        color: 0x1596b8,
        roughness: 0.26,
        metalness: 0.08
      });

      const water = new THREE.Mesh(geometry, material);
      water.rotation.x = -Math.PI / 2;
      water.position.y = -0.65;
      water.receiveShadow = true;

      scene.add(water);
      world.water = water;
    }

    function createIsland() {
      const islandGroup = new THREE.Group();

      const sandGeometry = new THREE.CylinderGeometry(
        17,
        20,
        2.2,
        48
      );

      const sandMaterial = new THREE.MeshStandardMaterial({
        color: 0xe3c177,
        roughness: 0.92
      });

      const sand = new THREE.Mesh(
        sandGeometry,
        sandMaterial
      );

      sand.position.y = 0;
      sand.scale.z = 0.74;
      sand.receiveShadow = true;
      sand.castShadow = true;

      islandGroup.add(sand);

      const grassGeometry = new THREE.CylinderGeometry(
        13.4,
        15.3,
        1.15,
        48
      );

      const grassMaterial = new THREE.MeshStandardMaterial({
        color: 0x65a957,
        roughness: 0.96
      });

      const grass = new THREE.Mesh(
        grassGeometry,
        grassMaterial
      );

      grass.position.y = 1.62;
      grass.scale.z = 0.72;
      grass.receiveShadow = true;
      grass.castShadow = true;

      islandGroup.add(grass);
      scene.add(islandGroup);

      createPalmTree(-8.5, 3.2, 0.12);
      createPalmTree(8.1, 2.5, -0.34);
      createPalmTree(10, -4.6, 0.45);

      createRock(-10.5, -4.8, 1.1);
      createRock(8.8, 6.8, 0.8);
      createRock(-5.2, 8.7, 0.65);
    }

    function createPalmTree(x, z, rotation = 0) {
      const group = new THREE.Group();

      const trunkMaterial = new THREE.MeshStandardMaterial({
        color: 0x8a5635,
        roughness: 0.9
      });

      const leafMaterial = new THREE.MeshStandardMaterial({
        color: 0x347c45,
        roughness: 0.88,
        side: THREE.DoubleSide
      });

      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.32, 0.52, 5.2, 8),
        trunkMaterial
      );

      trunk.position.y = 4.6;
      trunk.rotation.z = 0.08;
      trunk.castShadow = true;

      group.add(trunk);

      for (let index = 0; index < 7; index += 1) {
        const leaf = new THREE.Mesh(
          new THREE.ConeGeometry(0.75, 4.1, 4),
          leafMaterial
        );

        const angle = (index / 7) * Math.PI * 2;

        leaf.position.set(
          Math.cos(angle) * 1.25,
          7.2,
          Math.sin(angle) * 1.25
        );

        leaf.rotation.z = Math.PI / 2.8;
        leaf.rotation.y = -angle;
        leaf.castShadow = true;

        group.add(leaf);
      }

      group.position.set(x, 0, z);
      group.rotation.y = rotation;

      scene.add(group);
    }

    function createRock(x, z, scale) {
      const geometry = new THREE.DodecahedronGeometry(1.4, 0);

      const material = new THREE.MeshStandardMaterial({
        color: 0x768079,
        roughness: 0.96
      });

      const rock = new THREE.Mesh(geometry, material);

      rock.position.set(x, 2.2, z);
      rock.scale.set(scale, scale * 0.72, scale * 0.9);
      rock.rotation.set(
        Math.random(),
        Math.random(),
        Math.random()
      );

      rock.castShadow = true;
      rock.receiveShadow = true;

      scene.add(rock);
    }

    /* =========================================================
       玩家
    ========================================================= */

    function createPlayer() {
      const group = new THREE.Group();

      const bodyMaterial = new THREE.MeshStandardMaterial({
        color: 0x253346,
        roughness: 0.75
      });

      const shirtMaterial = new THREE.MeshStandardMaterial({
        color: 0x9d2f2f,
        roughness: 0.72
      });

      const skinMaterial = new THREE.MeshStandardMaterial({
        color: 0xf0b37e,
        roughness: 0.78
      });

      const body = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.58, 1.15, 6, 12),
        shirtMaterial
      );

      body.position.y = 1.32;
      body.castShadow = true;

      group.add(body);

      const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.48, 20, 16),
        skinMaterial
      );

      head.position.y = 2.43;
      head.castShadow = true;

      group.add(head);

      const hatBase = new THREE.Mesh(
        new THREE.CylinderGeometry(0.72, 0.72, 0.12, 20),
        bodyMaterial
      );

      hatBase.position.y = 2.85;
      hatBase.scale.z = 0.65;
      hatBase.castShadow = true;

      group.add(hatBase);

      const hatTop = new THREE.Mesh(
        new THREE.BoxGeometry(0.9, 0.34, 0.55),
        bodyMaterial
      );

      hatTop.position.y = 3.02;
      hatTop.castShadow = true;

      group.add(hatTop);

      group.position.set(0, 2.15, 6);
      group.rotation.y = Math.PI;

      scene.add(group);
      world.player = group;
    }

    /* =========================================================
       GLB 模型
    ========================================================= */

    function loadModel(fileName, options = {}) {
      const {
        position = new THREE.Vector3(),
        rotationY = 0,
        scale = 1
      } = options;

      return new Promise((resolve, reject) => {
        loader.load(
          MODEL_BASE_PATH + fileName,

          (gltf) => {
            const model = gltf.scene;

            model.position.copy(position);
            model.rotation.y = rotationY;
            model.scale.setScalar(scale);

            model.traverse((child) => {
              if (!child.isMesh) {
                return;
              }

              child.castShadow = true;
              child.receiveShadow = true;

              if (child.material) {
                child.material.side = THREE.FrontSide;
              }
            });

            scene.add(model);
            resolve(model);
          },

          undefined,

          (error) => {
            console.warn(
              `模型載入失敗：${fileName}`,
              error
            );

            reject(error);
          }
        );
      });
    }

    async function createChest() {
      try {
        const chest = await loadModel("chest.glb", {
          position: new THREE.Vector3(0, 2.25, -4),
          rotationY: Math.PI,
          scale: 1.8
        });

        chest.userData.interactionType = "chest";
        chest.userData.interactionLabel = "開啟寶箱";

        world.chest = chest;
      } catch {
        const chest = createFallbackChest();
        world.chest = chest;
      }
    }

    function createFallbackChest() {
      const group = new THREE.Group();

      const woodMaterial = new THREE.MeshStandardMaterial({
        color: 0x754223,
        roughness: 0.82
      });

      const metalMaterial = new THREE.MeshStandardMaterial({
        color: 0xd2a541,
        metalness: 0.55,
        roughness: 0.38
      });

      const base = new THREE.Mesh(
        new THREE.BoxGeometry(2, 1.05, 1.25),
        woodMaterial
      );

      base.position.y = 0.52;
      base.castShadow = true;
      group.add(base);

      const lid = new THREE.Mesh(
        new THREE.BoxGeometry(2.06, 0.5, 1.3),
        woodMaterial
      );

      lid.position.y = 1.3;
      lid.castShadow = true;
      lid.name = "fallback-chest-lid";

      group.add(lid);

      const lock = new THREE.Mesh(
        new THREE.BoxGeometry(0.35, 0.55, 0.12),
        metalMaterial
      );

      lock.position.set(0, 0.85, 0.68);
      lock.castShadow = true;

      group.add(lock);

      group.position.set(0, 2.2, -4);
      group.userData.interactionType = "chest";
      group.userData.interactionLabel = "開啟寶箱";

      scene.add(group);

      return group;
    }

    async function createBarrels() {
      const positions = [
        new THREE.Vector3(-4, 2.2, -2.5),
        new THREE.Vector3(-5.2, 2.2, -1.6),
        new THREE.Vector3(4.8, 2.2, -1)
      ];

      for (const position of positions) {
        try {
          await loadModel("barrel.glb", {
            position,
            rotationY: Math.random() * Math.PI,
            scale: 1.45
          });
        } catch {
          createFallbackBarrel(position);
        }
      }
    }

    function createFallbackBarrel(position) {
      const material = new THREE.MeshStandardMaterial({
        color: 0x764525,
        roughness: 0.85
      });

      const barrel = new THREE.Mesh(
        new THREE.CylinderGeometry(0.58, 0.68, 1.45, 12),
        material
      );

      barrel.position.copy(position);
      barrel.position.y += 0.7;
      barrel.castShadow = true;

      scene.add(barrel);
    }

    async function createShip() {
      try {
        const ship = await loadModel(
          "ship-pirate-small.glb",
          {
            position: new THREE.Vector3(25, -0.2, -10),
            rotationY: -Math.PI / 2.5,
            scale: 2.1
          }
        );

        world.ship = ship;
      } catch {
        const fallbackShip = new THREE.Mesh(
          new THREE.BoxGeometry(8, 2, 3),
          new THREE.MeshStandardMaterial({
            color: 0x633719,
            roughness: 0.86
          })
        );

        fallbackShip.position.set(25, 0.25, -10);
        fallbackShip.rotation.y = -Math.PI / 2.5;
        fallbackShip.castShadow = true;

        scene.add(fallbackShip);
        world.ship = fallbackShip;
      }
    }

    /* =========================================================
       輸入控制
    ========================================================= */

    function setKeyboardState(code, isPressed) {
      switch (code) {
        case "KeyW":
        case "ArrowUp":
          input.forward = isPressed;
          break;

        case "KeyS":
        case "ArrowDown":
          input.backward = isPressed;
          break;

        case "KeyA":
        case "ArrowLeft":
          input.left = isPressed;
          break;

        case "KeyD":
        case "ArrowRight":
          input.right = isPressed;
          break;

        case "KeyE":
        case "Space":
          if (isPressed) {
            input.interactRequested = true;
          }
          break;

        default:
          break;
      }
    }

    window.addEventListener("keydown", (event) => {
      if (
        [
          "KeyW",
          "KeyA",
          "KeyS",
          "KeyD",
          "ArrowUp",
          "ArrowDown",
          "ArrowLeft",
          "ArrowRight",
          "KeyE",
          "Space"
        ].includes(event.code)
      ) {
        event.preventDefault();
      }

      setKeyboardState(event.code, true);
    });

    window.addEventListener("keyup", (event) => {
      setKeyboardState(event.code, false);
    });

    window.addEventListener("blur", () => {
      input.forward = false;
      input.backward = false;
      input.left = false;
      input.right = false;
      input.joystickX = 0;
      input.joystickY = 0;

      resetJoystickVisual();
    });

    /* =========================================================
       虛擬搖桿
    ========================================================= */

    let joystickPointerId = null;

    function updateJoystick(event) {
      const rect = joystickArea.getBoundingClientRect();

      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      const deltaX = event.clientX - centerX;
      const deltaY = event.clientY - centerY;

      const maxDistance = rect.width * 0.28;
      const distance = Math.hypot(deltaX, deltaY);

      const limitedDistance = Math.min(distance, maxDistance);
      const angle = Math.atan2(deltaY, deltaX);

      const limitedX = Math.cos(angle) * limitedDistance;
      const limitedY = Math.sin(angle) * limitedDistance;

      input.joystickX = limitedX / maxDistance;
      input.joystickY = limitedY / maxDistance;

      joystickStick.style.transform =
        `translate(
          calc(-50% + ${limitedX}px),
          calc(-50% + ${limitedY}px)
        )`;
    }

    function resetJoystickVisual() {
      joystickStick.style.transform =
        "translate(-50%, -50%)";
    }

    function releaseJoystick(event) {
      if (
        joystickPointerId !== null &&
        event.pointerId !== joystickPointerId
      ) {
        return;
      }

      joystickPointerId = null;

      input.joystickX = 0;
      input.joystickY = 0;

      resetJoystickVisual();
    }

    joystickArea.addEventListener(
      "pointerdown",
      (event) => {
        event.preventDefault();

        joystickPointerId = event.pointerId;
        joystickArea.setPointerCapture(event.pointerId);

        updateJoystick(event);
      }
    );

    joystickArea.addEventListener(
      "pointermove",
      (event) => {
        if (event.pointerId !== joystickPointerId) {
          return;
        }

        event.preventDefault();
        updateJoystick(event);
      }
    );

    joystickArea.addEventListener(
      "pointerup",
      releaseJoystick
    );

    joystickArea.addEventListener(
      "pointercancel",
      releaseJoystick
    );

    actionButton.addEventListener(
      "pointerdown",
      (event) => {
        event.preventDefault();

        actionButton.classList.add("pressed");
        input.interactRequested = true;
      }
    );

    actionButton.addEventListener(
      "pointerup",
      () => {
        actionButton.classList.remove("pressed");
      }
    );

    actionButton.addEventListener(
      "pointercancel",
      () => {
        actionButton.classList.remove("pressed");
      }
    );

    /* =========================================================
       玩家移動與互動
    ========================================================= */

    function getMovementInput() {
      let x = 0;
      let z = 0;

      if (input.left) {
        x -= 1;
      }

      if (input.right) {
        x += 1;
      }

      if (input.forward) {
        z -= 1;
      }

      if (input.backward) {
        z += 1;
      }

      x += input.joystickX;
      z += input.joystickY;

      const movement = new THREE.Vector2(x, z);

      if (movement.length() > 1) {
        movement.normalize();
      }

      return movement;
    }

    function updatePlayer(deltaTime) {
      if (!world.player) {
        return;
      }

      const movement = getMovementInput();
      const movementStrength = movement.length();

      if (movementStrength > 0.04) {
        const moveSpeed = 7.2;

        world.player.position.x +=
          movement.x * moveSpeed * deltaTime;

        world.player.position.z +=
          movement.y * moveSpeed * deltaTime;

        const targetRotation = Math.atan2(
          movement.x,
          movement.y
        );

        world.player.rotation.y = lerpAngle(
          world.player.rotation.y,
          targetRotation,
          Math.min(1, deltaTime * 12)
        );

        const walkBounce =
          Math.sin(clock.elapsedTime * 11) * 0.07;

        world.player.position.y = 2.15 + walkBounce;
      } else {
        world.player.position.y = THREE.MathUtils.lerp(
          world.player.position.y,
          2.15,
          Math.min(1, deltaTime * 10)
        );
      }

      constrainPlayerToIsland();
    }

    function constrainPlayerToIsland() {
      const x = world.player.position.x;
      const z = world.player.position.z;

      const normalizedDistance =
        Math.sqrt(
          (x * x) / (14.8 * 14.8) +
          (z * z) / (10.6 * 10.6)
        );

      if (normalizedDistance <= 1) {
        return;
      }

      world.player.position.x /= normalizedDistance;
      world.player.position.z /= normalizedDistance;
    }

    function lerpAngle(current, target, amount) {
      let difference =
        ((target - current + Math.PI) %
          (Math.PI * 2)) -
        Math.PI;

      if (difference < -Math.PI) {
        difference += Math.PI * 2;
      }

      return current + difference * amount;
    }

    function updateInteraction() {
      if (!world.player || !world.chest) {
        interactionPrompt.classList.remove("visible");
        return;
      }

      const distance = world.player.position.distanceTo(
        world.chest.position
      );

      if (distance <= interactionDistance) {
        world.currentInteractable = world.chest;

        interactionPrompt.textContent =
          isMobileDevice()
            ? "點擊互動按鈕"
            : "按 E 開啟寶箱";

        interactionPrompt.classList.add("visible");
      } else {
        world.currentInteractable = null;
        interactionPrompt.classList.remove("visible");
      }

      if (input.interactRequested) {
        input.interactRequested = false;

        if (world.currentInteractable) {
          interactWithCurrentObject();
        } else {
          showMessage("附近沒有可以互動的物件");
        }
      }
    }

    function interactWithCurrentObject() {
      const interactable = world.currentInteractable;

      if (
        interactable.userData.interactionType === "chest"
      ) {
        openChest();
      }
    }

    function openChest() {
      if (!world.chestClosed) {
        showMessage("寶箱已經打開了");
        return;
      }

      world.chestClosed = false;

      const fallbackLid =
        world.chest.getObjectByName(
          "fallback-chest-lid"
        );

      if (fallbackLid) {
        fallbackLid.rotation.x = -Math.PI * 0.6;
        fallbackLid.position.z = -0.28;
      } else {
        world.chest.rotation.y += 0.08;
        world.chest.scale.multiplyScalar(1.08);
      }

      objectiveElement.textContent =
        "目標完成：你取得了海盜寶藏";

      showMessage("獲得寶藏：古老金幣 × 100");
    }

    function showMessage(text) {
      messageElement.textContent = text;
      messageElement.classList.add("visible");

      window.clearTimeout(messageTimer);

      messageTimer = window.setTimeout(() => {
        messageElement.classList.remove("visible");
      }, 2200);
    }

    function isMobileDevice() {
      return window.matchMedia(
        "(pointer: coarse), (max-width: 900px)"
      ).matches;
    }

    /* =========================================================
       攝影機
    ========================================================= */

    function updateCamera(deltaTime) {
      if (!world.player) {
        return;
      }

      const targetPosition = new THREE.Vector3(
        world.player.position.x + 15,
        19,
        world.player.position.z + 20
      );

      camera.position.lerp(
        targetPosition,
        Math.min(1, deltaTime * 3.4)
      );

      const lookTarget = new THREE.Vector3(
        world.player.position.x,
        2.3,
        world.player.position.z - 1.8
      );

      camera.lookAt(lookTarget);
    }

    /* =========================================================
       環境動畫
    ========================================================= */

    function updateEnvironment() {
      if (world.water) {
        const pulse =
          Math.sin(clock.elapsedTime * 0.7) * 0.025;

        world.water.position.y = -0.65 + pulse;
      }

      if (world.ship) {
        world.ship.position.y =
          -0.2 +
          Math.sin(clock.elapsedTime * 1.15) * 0.16;

        world.ship.rotation.z =
          Math.sin(clock.elapsedTime * 0.8) * 0.018;
      }
    }

    /* =========================================================
       載入
    ========================================================= */

    function setLoadingProgress(percent, text) {
      loadingProgress.style.width = `${percent}%`;
      loadingText.textContent = text;
    }

    async function initializeGame() {
      setLoadingProgress(10, "建立光源……");
      createLights();

      setLoadingProgress(24, "建立海洋……");
      createWater();

      setLoadingProgress(38, "建立島嶼……");
      createIsland();

      setLoadingProgress(50, "建立玩家……");
      createPlayer();

      setLoadingProgress(64, "載入寶箱……");
      await createChest();

      setLoadingProgress(76, "載入場景道具……");
      await createBarrels();

      setLoadingProgress(88, "載入海盜船……");
      await createShip();

      setLoadingProgress(100, "完成");

      window.setTimeout(() => {
        loadingScreen.classList.add("hidden");
        canvas.focus();
      }, 350);
    }

    /* =========================================================
       主迴圈
    ========================================================= */

    function animate() {
      requestAnimationFrame(animate);

      const deltaTime = Math.min(clock.getDelta(), 0.05);

      updatePlayer(deltaTime);
      updateInteraction();
      updateCamera(deltaTime);
      updateEnvironment();

      renderer.render(scene, camera);
    }

    initializeGame().catch((error) => {
      console.error("遊戲初始化失敗：", error);

      loadingText.textContent =
        "部分模型載入失敗，將使用暫代模型";
    });

    animate();
  </script>
</body>
</html>
