<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >
  <title>Pirate Adventure V0.3</title>

  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #071018;
      touch-action: none;
      overscroll-behavior: none;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button {
      font: inherit;
    }

    #game-wrapper {
      position: relative;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      max-width: 1280px;
      max-height: 720px;
      overflow: hidden;
      background: #0d2832;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.04),
        0 28px 80px rgba(0, 0, 0, 0.48);
    }

    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      background: #58bed4;
    }

    /* Orientation */
    #orientation-screen {
      position: absolute;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      background:
        radial-gradient(circle at center, #173442 0%, #071018 74%);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.55s ease, visibility 0.55s ease;
    }

    #orientation-screen.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .orientation-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      padding: 28px;
      text-align: center;
      animation: orientationBreathe 2s ease-in-out infinite;
    }

    .phone-rotate-icon {
      position: relative;
      width: 70px;
      height: 116px;
      border: 4px solid rgba(255, 255, 255, 0.92);
      border-radius: 14px;
      transform: rotate(-18deg);
      animation: phoneRotate 2.2s ease-in-out infinite;
    }

    .phone-rotate-icon::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 7px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.92);
      transform: translateX(-50%);
    }

    .phone-rotate-icon::after {
      content: "↻";
      position: absolute;
      top: 50%;
      left: 100%;
      margin-left: 18px;
      color: rgba(255, 255, 255, 0.82);
      font-size: 44px;
      transform: translateY(-50%);
    }

    .orientation-title {
      font-size: clamp(24px, 6vw, 38px);
      font-weight: 800;
      letter-spacing: 2px;
    }

    .orientation-subtitle {
      margin-top: 9px;
      color: rgba(255, 255, 255, 0.66);
      font-size: clamp(14px, 3.5vw, 18px);
      line-height: 1.6;
    }

    @keyframes orientationBreathe {
      0%, 100% { opacity: 0.58; transform: scale(0.96); }
      50% { opacity: 1; transform: scale(1.04); }
    }

    @keyframes phoneRotate {
      0%, 100% { transform: rotate(-18deg); }
      50% { transform: rotate(72deg); }
    }

    /* Loading */
    #loading-page {
      position: absolute;
      inset: 0;
      z-index: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        radial-gradient(
          circle at 50% 40%,
          rgba(46, 92, 104, 0.68) 0%,
          rgba(11, 28, 36, 0.98) 50%,
          #060d13 100%
        );
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition: opacity 0.75s ease, visibility 0.75s ease;
    }

    #loading-page.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #loading-page::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.12;
      background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      animation: loadingGridMove 10s linear infinite;
    }

    #loading-page::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -150px;
      width: 680px;
      height: 280px;
      border-radius: 50%;
      background:
        radial-gradient(ellipse, rgba(70, 177, 193, 0.22) 0%, transparent 70%);
      transform: translateX(-50%);
    }

    @keyframes loadingGridMove {
      from { background-position: 0 0; }
      to { background-position: 48px 48px; }
    }

    .loading-content {
      position: relative;
      z-index: 2;
      width: min(78%, 560px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .game-logo {
      margin-bottom: 48px;
      opacity: 0;
      transform: translateY(18px);
      animation: logoFadeIn 0.9s 0.2s ease forwards;
    }

    .logo-main {
      display: block;
      color: #f7f5ed;
      font-size: clamp(42px, 7vw, 86px);
      font-weight: 900;
      letter-spacing: clamp(6px, 1.1vw, 14px);
      text-shadow:
        0 4px 0 rgba(0, 0, 0, 0.42),
        0 14px 32px rgba(0, 0, 0, 0.62);
    }

    .logo-sub {
      display: block;
      margin-top: 5px;
      color: rgba(214, 222, 220, 0.72);
      font-size: clamp(13px, 1.8vw, 22px);
      font-weight: 700;
      letter-spacing: clamp(8px, 1.5vw, 18px);
    }

    @keyframes logoFadeIn {
      to { opacity: 1; transform: translateY(0); }
    }

    #loading-status {
      width: 100%;
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    #loading-status.hidden {
      opacity: 0;
      transform: translateY(-10px);
      pointer-events: none;
    }

    .loading-text {
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      gap: 18px;
      color: rgba(255, 255, 255, 0.78);
      font-size: clamp(13px, 1.8vw, 18px);
      letter-spacing: 1px;
    }

    #loading-message { text-align: left; }
    #progress-number { min-width: 52px; text-align: right; }

    #progress-track {
      position: relative;
      width: 100%;
      height: clamp(12px, 1.7vw, 18px);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.36);
    }

    #progress-bar {
      position: relative;
      width: 0%;
      height: 100%;
      overflow: hidden;
      border-radius: inherit;
      background:
        linear-gradient(90deg, #b48a45, #f0d78a, #bd9149);
      box-shadow: 0 0 18px rgba(239, 207, 124, 0.32);
      transition: width 0.12s linear;
    }

    #progress-bar::after {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 120px;
      background:
        linear-gradient(90deg, transparent, rgba(255,255,255,0.58), transparent);
      animation: loadingShine 1.2s linear infinite;
    }

    @keyframes loadingShine {
      from { transform: translateX(-130px); }
      to { transform: translateX(620px); }
    }

    #start-game-button {
      position: absolute;
      top: calc(100% - 68px);
      min-width: 220px;
      padding: 15px 34px;
      border: 1px solid rgba(255, 255, 255, 0.42);
      border-radius: 8px;
      color: #fff;
      background:
        linear-gradient(180deg, rgba(178,135,69,0.97), rgba(92,61,31,0.99));
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.42);
      font-size: clamp(17px, 2.2vw, 24px);
      font-weight: 800;
      letter-spacing: 3px;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transform: translateY(16px);
      transition:
        opacity 0.6s ease,
        visibility 0.6s ease,
        transform 0.6s ease,
        filter 0.2s ease;
    }

    #start-game-button.visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    #start-game-button:hover { filter: brightness(1.12); }
    #start-game-button:active { transform: scale(0.96); }

    /* Stage intro */
    #stage-intro {
      position: absolute;
      inset: 0;
      z-index: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #fff;
      background: rgba(0, 0, 0, 0.58);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }

    #stage-intro.visible {
      opacity: 1;
      visibility: visible;
    }

    #stage-intro.fade-out { opacity: 0; }

    #stage-intro-title {
      font-size: clamp(44px, 7vw, 88px);
      font-weight: 900;
      letter-spacing: clamp(7px, 1.5vw, 18px);
      text-shadow:
        0 5px 0 rgba(0, 0, 0, 0.46),
        0 16px 40px rgba(0, 0, 0, 0.78);
      opacity: 0;
      transform: scale(0.88);
    }

    #stage-intro-subtitle {
      color: rgba(255, 255, 255, 0.74);
      font-size: clamp(18px, 2.6vw, 32px);
      font-weight: 700;
      letter-spacing: 5px;
      opacity: 0;
      transform: translateY(10px);
    }

    #stage-intro.visible #stage-intro-title {
      animation: stageTitleEnter 0.35s ease forwards;
    }

    #stage-intro.visible #stage-intro-subtitle {
      animation: stageSubtitleEnter 0.45s 0.16s ease forwards;
    }

    @keyframes stageTitleEnter {
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes stageSubtitleEnter {
      to { opacity: 1; transform: translateY(0); }
    }

    /* HUD */
    #hud {
      position: absolute;
      inset: 0;
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }

    #hud.visible {
      opacity: 1;
      visibility: visible;
    }

    #mission-panel {
      position: absolute;
      top: 22px;
      left: 24px;
      max-width: 420px;
      padding: 13px 17px;
      border-left: 4px solid rgba(235, 196, 105, 0.92);
      color: #fff;
      background:
        linear-gradient(90deg, rgba(5,18,25,0.82), rgba(5,18,25,0.28));
      text-shadow: 0 2px 4px rgba(0,0,0,0.48);
      opacity: 0;
      transform: translateX(-14px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    #mission-panel.visible {
      opacity: 1;
      transform: translateX(0);
    }

    #mission-label {
      margin-bottom: 4px;
      color: rgba(239, 205, 122, 0.94);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 3px;
    }

    #mission-text {
      font-size: clamp(14px, 1.6vw, 20px);
      font-weight: 700;
      line-height: 1.45;
    }

    #desktop-help {
      position: absolute;
      top: 20px;
      left: 50%;
      padding: 9px 15px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 7px;
      color: rgba(255,255,255,0.7);
      background: rgba(5,18,25,0.5);
      font-size: clamp(11px, 1.2vw, 15px);
      transform: translateX(-50%);
      backdrop-filter: blur(6px);
    }

    #interaction-prompt {
      position: absolute;
      left: 50%;
      bottom: 56px;
      min-width: 240px;
      padding: 12px 20px;
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 999px;
      color: #fff;
      background: rgba(4,16,23,0.82);
      font-size: clamp(13px, 1.4vw, 17px);
      font-weight: 800;
      text-align: center;
      opacity: 0;
      transform: translateX(-50%) translateY(10px);
      transition: opacity 0.18s ease, transform 0.18s ease;
      backdrop-filter: blur(8px);
    }

    #interaction-prompt.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #toast-message {
      position: absolute;
      left: 50%;
      top: 98px;
      max-width: 560px;
      padding: 13px 22px;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 9px;
      color: #fff;
      background: rgba(4,16,23,0.86);
      font-size: clamp(14px, 1.6vw, 19px);
      font-weight: 800;
      text-align: center;
      opacity: 0;
      transform: translateX(-50%) translateY(-10px);
      transition: opacity 0.25s ease, transform 0.25s ease;
      backdrop-filter: blur(8px);
    }

    #toast-message.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Touch controls */
    #touch-controls {
      position: absolute;
      inset: 0;
      z-index: 200;
      display: none;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }

    #touch-controls.visible {
      opacity: 1;
      visibility: visible;
    }

    #joystick-zone {
      position: absolute;
      left: max(22px, calc(var(--safe-left) + 16px));
      bottom: max(20px, calc(var(--safe-bottom) + 14px));
      width: 150px;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      touch-action: none;
    }

    #joystick-base {
      position: relative;
      width: 124px;
      height: 124px;
      border: 2px solid rgba(255,255,255,0.17);
      border-radius: 50%;
      background: rgba(4,17,24,0.28);
      box-shadow:
        inset 0 0 20px rgba(255,255,255,0.035),
        0 8px 22px rgba(0,0,0,0.16);
      backdrop-filter: blur(5px);
    }

    #joystick-stick {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 58px;
      height: 58px;
      border: 2px solid rgba(255,255,255,0.24);
      border-radius: 50%;
      background:
        radial-gradient(circle at 36% 30%, rgba(255,255,255,0.24), rgba(18,47,56,0.65));
      box-shadow: 0 8px 18px rgba(0,0,0,0.22);
      transform: translate(-50%, -50%);
    }

    #interaction-button {
      position: absolute;
      right: max(34px, calc(var(--safe-right) + 24px));
      bottom: max(42px, calc(var(--safe-bottom) + 28px));
      width: 92px;
      height: 92px;
      border: 2px solid rgba(255,255,255,0.25);
      border-radius: 50%;
      color: rgba(255,255,255,0.94);
      background:
        radial-gradient(circle at 35% 28%, rgba(191,151,79,0.88), rgba(73,47,26,0.86));
      box-shadow:
        0 10px 24px rgba(0,0,0,0.25),
        inset 0 3px 7px rgba(255,255,255,0.18);
      font-size: 17px;
      font-weight: 900;
      pointer-events: auto;
      touch-action: manipulation;
      transition: transform 0.1s ease, filter 0.1s ease;
    }

    #interaction-button.pressed {
      transform: scale(0.92);
      filter: brightness(0.88);
    }

    /* Complete screen */
    #complete-screen {
      position: absolute;
      inset: 0;
      z-index: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: #fff;
      background: rgba(3, 12, 18, 0.84);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.55s ease, visibility 0.55s ease;
    }

    #complete-screen.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    #complete-title {
      font-size: clamp(42px, 7vw, 86px);
      font-weight: 900;
      letter-spacing: clamp(7px, 1.4vw, 18px);
      text-shadow: 0 12px 32px rgba(0,0,0,0.7);
    }

    #complete-subtitle {
      color: rgba(255,255,255,0.72);
      font-size: clamp(18px, 2.4vw, 30px);
      font-weight: 700;
      letter-spacing: 4px;
    }

    #restart-button {
      margin-top: 22px;
      min-width: 190px;
      padding: 14px 28px;
      border: 1px solid rgba(255,255,255,0.38);
      border-radius: 8px;
      color: #fff;
      background: linear-gradient(180deg, #b08446, #5b3b22);
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 3px;
      cursor: pointer;
    }

    @media (pointer: coarse), (max-width: 900px) {
      #touch-controls { display: block; }
      #desktop-help { display: none; }

      #mission-panel {
        top: 15px;
        left: 17px;
        max-width: 330px;
        padding: 10px 13px;
      }

      #interaction-prompt { bottom: 152px; }
    }

    @media (pointer: fine) and (hover: hover) {
      #touch-controls { display: none !important; }
    }

    @media (max-height: 520px) and (pointer: coarse) {
      #joystick-zone {
        left: max(14px, calc(var(--safe-left) + 8px));
        bottom: max(8px, calc(var(--safe-bottom) + 4px));
        width: 124px;
        height: 124px;
      }

      #joystick-base { width: 104px; height: 104px; }
      #joystick-stick { width: 50px; height: 50px; }

      #interaction-button {
        right: max(24px, calc(var(--safe-right) + 16px));
        bottom: max(24px, calc(var(--safe-bottom) + 14px));
        width: 78px;
        height: 78px;
        font-size: 15px;
      }

      #interaction-prompt { bottom: 124px; }
    }
  </style>
</head>

<body>
  <main id="game-wrapper">
    <canvas id="game-canvas" width="1280" height="720" tabindex="0"></canvas>

    <section id="orientation-screen">
      <div class="orientation-content">
        <div class="phone-rotate-icon" aria-hidden="true"></div>
        <div>
          <div class="orientation-title">請將手機轉為橫向</div>
          <div class="orientation-subtitle">橫向模式可獲得最佳遊戲體驗</div>
        </div>
      </div>
    </section>

    <section id="loading-page">
      <div class="loading-content">
        <div class="game-logo">
          <span class="logo-main">PIRATE</span>
          <span class="logo-sub">ADVENTURE</span>
        </div>

        <div id="loading-status">
          <div class="loading-text">
            <span id="loading-message">正在確認航行路線……</span>
            <span id="progress-number">0%</span>
          </div>

          <div id="progress-track">
            <div id="progress-bar"></div>
          </div>
        </div>

        <button id="start-game-button" type="button">開始冒險</button>
      </div>
    </section>

    <section id="stage-intro">
      <div id="stage-intro-title">CHAPTER 1</div>
      <div id="stage-intro-subtitle">寶藏島</div>
    </section>

    <section id="hud">
      <div id="mission-panel">
        <div id="mission-label">MISSION 1 / 5</div>
        <div id="mission-text">調查海岸邊的擱淺船</div>
      </div>

      <div id="desktop-help">WASD／方向鍵移動｜E／Space 互動</div>
      <div id="toast-message"></div>
      <div id="interaction-prompt">按 E 互動</div>
    </section>

    <section id="touch-controls">
      <div id="joystick-zone">
        <div id="joystick-base">
          <div id="joystick-stick"></div>
        </div>
      </div>

      <button id="interaction-button" type="button">互動</button>
    </section>

    <section id="complete-screen">
      <div id="complete-title">CHAPTER COMPLETE</div>
      <div id="complete-subtitle">寶藏島探索完成</div>
      <button id="restart-button" type="button">再次遊玩</button>
    </section>
  </main>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

    const canvas = document.getElementById("game-canvas");
    const orientationScreen = document.getElementById("orientation-screen");
    const loadingPage = document.getElementById("loading-page");
    const loadingStatus = document.getElementById("loading-status");
    const loadingMessage = document.getElementById("loading-message");
    const progressNumber = document.getElementById("progress-number");
    const progressBar = document.getElementById("progress-bar");
    const startGameButton = document.getElementById("start-game-button");
    const stageIntro = document.getElementById("stage-intro");
    const hud = document.getElementById("hud");
    const missionPanel = document.getElementById("mission-panel");
    const missionLabel = document.getElementById("mission-label");
    const missionText = document.getElementById("mission-text");
    const toastMessage = document.getElementById("toast-message");
    const interactionPrompt = document.getElementById("interaction-prompt");
    const touchControls = document.getElementById("touch-controls");
    const joystickZone = document.getElementById("joystick-zone");
    const joystickStick = document.getElementById("joystick-stick");
    const interactionButton = document.getElementById("interaction-button");
    const completeScreen = document.getElementById("complete-screen");
    const restartButton = document.getElementById("restart-button");

    const GAME_WIDTH = 1280;
    const GAME_HEIGHT = 720;
    const MODEL_BASE_PATH = "./assets/models/pirate/";
    const PLAYER_BASE_Y = 2.18;
    const PLAYER_SPEED = 7.0;
    const INTERACTION_DISTANCE = 3.5;

    const missions = [
      {
        id: "inspect-wreck",
        text: "調查海岸邊的擱淺船",
        targetType: "wreck"
      },
      {
        id: "collect-supplies",
        text: "回收遺失的航海物資",
        targetType: "supply",
        required: 3
      },
      {
        id: "repair-cannon",
        text: "使用物資修復岸防砲",
        targetType: "cannon"
      },
      {
        id: "open-treasure",
        text: "找到並開啟船長的寶箱",
        targetType: "chest"
      },

    function setLoadingProgress(percentage, customMessage = null) {
      const safe = THREE.MathUtils.clamp(Math.round(percentage), 0, 100);

      progressBar.style.width = `${safe}%`;
      progressNumber.textContent = `${safe}%`;

      if (customMessage) {
        loadingMessage.textContent = customMessage;
        return;
      }

      const messageIndex = Math.min(
        loadingMessages.length - 1,
        Math.floor(safe / (100 / loadingMessages.length))
      );

      loadingMessage.textContent = loadingMessages[messageIndex];
    }

    function createPalmTree(x, z, rotationY = 0) {
      const group = new THREE.Group();

      const trunkMaterial = new THREE.MeshStandardMaterial({
        color: 0x865333,
        roughness: 0.92
      });

      const leafMaterial = new THREE.MeshStandardMaterial({
        color: 0x347a43,
        roughness: 0.9,
        side: THREE.DoubleSide
      });

      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.3, 0.52, 5.1, 8),
        trunkMaterial
      );

      trunk.position.y = 4.65;
      trunk.rotation.z = 0.08;
      trunk.castShadow = true;
      group.add(trunk);

      for (let i = 0; i < 7; i += 1) {
        const angle = (i / 7) * Math.PI * 2;

        const leaf = new THREE.Mesh(
          new THREE.ConeGeometry(0.72, 4, 4),
          leafMaterial
        );

        leaf.position.set(
          Math.cos(angle) * 1.2,
          7.15,
          Math.sin(angle) * 1.2
        );

        leaf.rotation.z = Math.PI / 2.8;
        leaf.rotation.y = -angle;
        leaf.castShadow = true;
        group.add(leaf);
      }

      group.position.set(x, 0, z);
      group.rotation.y = rotationY;
      scene.add(group);
    }

    function makeMaterial(color, roughness = 0.75, metalness = 0) {

    function makeMesh(geometry, material, position, rotation = null) {
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.copy(position);

      if (rotation) {
        mesh.rotation.set(rotation.x, rotation.y, rotation.z);
      }

      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    function configureModel(model) {
      model.traverse((child) => {
        if (!child.isMesh) return;
        child.castShadow = true;
        child.receiveShadow = true;
        if (child.material) child.material.side = THREE.FrontSide;
      });
    }

    function loadModel(fileName, options = {}) {
      const {
        position = new THREE.Vector3(),
        rotationY = 0,
        scale = 1
      } = options;

      return new Promise((resolve, reject) => {
        loader.load(
          MODEL_BASE_PATH + fileName,
          (gltf) => {
            const model = gltf.scene;
            configureModel(model);
            model.position.copy(position);
            model.rotation.y = rotationY;
            model.scale.setScalar(scale);
            scene.add(model);
            resolve(model);
          },
          undefined,
          reject
        );
      });
    }

    function createInteractableMarker(parent, color = 0xf2d271) {
      const group = new THREE.Group();

      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(0.75, 0.07, 10, 28),
        new THREE.MeshBasicMaterial({
          color,
          transparent: true,
          opacity: 0.8
        })
      );
      ring.rotation.x = Math.PI / 2;
      group.add(ring);

      const beam = new THREE.Mesh(
        new THREE.CylinderGeometry(0.08, 0.25, 2.4, 10, 1, true),
        new THREE.MeshBasicMaterial({
          color,
          transparent: true,
          opacity: 0.2,
          side: THREE.DoubleSide
        })
      );
      beam.position.y = 1.2;
      group.add(beam);

      group.visible = false;
      parent.add(group);
      parent.userData.marker = group;
    }

    function registerInteractable(object, type, label) {
      object.userData.type = type;
      object.userData.label = label;
      object.userData.active = true;
      createInteractableMarker(object);
      world.interactables.push(object);
    }

      );
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    function setKeyboardState(code, isPressed) {
      if (!state.inputEnabled) return;

      switch (code) {
        case "KeyW":
        case "ArrowUp":
          input.forward = isPressed;
          break;
        case "KeyS":
        case "ArrowDown":
          input.backward = isPressed;
          break;
        case "KeyA":
        case "ArrowLeft":
          input.left = isPressed;
          break;
        case "KeyD":
        case "ArrowRight":
          input.right = isPressed;
          break;
        case "KeyE":
        case "Space":
          if (isPressed) input.interactionRequested = true;
          break;
      }
    }

    window.addEventListener("keydown", (event) => {
      const controlledKeys = [
        "KeyW", "KeyA", "KeyS", "KeyD",
        "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight",
        "KeyE", "Space"
      ];

      if (controlledKeys.includes(event.code)) event.preventDefault();
      setKeyboardState(event.code, true);
    });

    window.addEventListener("keyup", (event) => {
      setKeyboardState(event.code, false);
    });

    window.addEventListener("blur", resetInput);

    function resetInput() {
      input.forward = false;
      input.backward = false;
      input.left = false;
      input.right = false;
      input.joystickX = 0;
      input.joystickY = 0;
      resetJoystickVisual();
    }

    let joystickPointerId = null;

    function updateJoystick(event) {
      if (!state.inputEnabled) return;

      const rect = joystickZone.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const deltaX = event.clientX - centerX;
      const deltaY = event.clientY - centerY;
      const maxDistance = rect.width * 0.28;
      const distance = Math.hypot(deltaX, deltaY);
      const limitedDistance = Math.min(distance, maxDistance);
      const angle = Math.atan2(deltaY, deltaX);
      const limitedX = Math.cos(angle) * limitedDistance;
      const limitedY = Math.sin(angle) * limitedDistance;

      input.joystickX = limitedX / maxDistance;
      input.joystickY = limitedY / maxDistance;

      joystickStick.style.transform =
        `translate(calc(-50% + ${limitedX}px), calc(-50% + ${limitedY}px))`;
    }

    function resetJoystickVisual() {
      joystickStick.style.transform = "translate(-50%, -50%)";
    }

    function releaseJoystick(event) {
      if (
        joystickPointerId !== null &&
        event.pointerId !== joystickPointerId
      ) return;

      joystickPointerId = null;
      input.joystickX = 0;
      input.joystickY = 0;
      resetJoystickVisual();
    }

    joystickZone.addEventListener("pointerdown", (event) => {
      if (!state.inputEnabled) return;
      event.preventDefault();
      joystickPointerId = event.pointerId;
      joystickZone.setPointerCapture(event.pointerId);
      updateJoystick(event);
    });

    joystickZone.addEventListener("pointermove", (event) => {
      if (event.pointerId !== joystickPointerId) return;
      event.preventDefault();
      updateJoystick(event);
    });

    joystickZone.addEventListener("pointerup", releaseJoystick);
    joystickZone.addEventListener("pointercancel", releaseJoystick);

    interactionButton.addEventListener("pointerdown", (event) => {
      if (!state.inputEnabled) return;
      event.preventDefault();
      interactionButton.classList.add("pressed");
      input.interactionRequested = true;
    });

    interactionButton.addEventListener("pointerup", () => {
      interactionButton.classList.remove("pressed");
    });

    interactionButton.addEventListener("pointercancel", () => {
      interactionButton.classList.remove("pressed");
    });

    startGameButton.addEventListener("click", startGame);
    restartButton.addEventListener("click", () => window.location.reload());

    function startGame() {
      if (!state.assetsReady || state.gameStarted) return;

      state.gameStarted = true;
      startGameButton.disabled = true;
      loadingPage.classList.add("hidden");

      window.setTimeout(showStageIntro, 420);
    }

    function showStageIntro() {
      stageIntro.classList.add("visible");

      window.setTimeout(() => {
        stageIntro.classList.add("fade-out");
      }, 1500);

      window.setTimeout(() => {
        stageIntro.classList.remove("visible", "fade-out");
        enableGameplay();
      }, 2050);
    }

    function enableGameplay() {
      state.inputEnabled = true;
      hud.classList.add("visible");

      if (isTouchDevice()) {
        touchControls.classList.add("visible");
      }

      window.setTimeout(() => {
        missionPanel.classList.add("visible");
      }, 180);

      updateMissionUI();
      canvas.focus();
    }

    function getMovementInput() {
      let x = 0;
      let z = 0;

      if (input.left) x -= 1;
      if (input.right) x += 1;
      if (input.forward) z -= 1;
      if (input.backward) z += 1;

      x += input.joystickX;
      z += input.joystickY;

      const movement = new THREE.Vector2(x, z);
      if (movement.length() > 1) movement.normalize();
      return movement;
    }

    function updatePlayer(deltaTime) {
      if (!world.player || !state.inputEnabled) return;

      const movement = getMovementInput();
      const strength = movement.length();

      if (strength > 0.04) {
        world.player.position.x += movement.x * PLAYER_SPEED * deltaTime;
        world.player.position.z += movement.y * PLAYER_SPEED * deltaTime;

        const targetRotation = Math.atan2(movement.x, movement.y);
        world.player.rotation.y = lerpAngle(
          world.player.rotation.y,
          targetRotation,
          Math.min(1, deltaTime * 12)
        );
      }

      constrainPlayerToIsland();
      animatePirate(strength, deltaTime);
    }

    function animatePirate(strength, deltaTime) {
      const parts = world.playerParts;
      if (!parts) return;

      const t = clock.elapsedTime;

      if (strength > 0.04) {
        const swing = Math.sin(t * 9) * 0.72;

        parts.leftArm.root.rotation.x = swing;
        parts.rightArm.root.rotation.x = -swing;
        parts.leftLeg.root.rotation.x = -swing * 0.82;
        parts.rightLeg.root.rotation.x = swing * 0.82;

        parts.leftArm.forearm.rotation.x = Math.max(0, -swing) * 0.25;
        parts.rightArm.forearm.rotation.x = Math.max(0, swing) * 0.25;

        world.player.position.y =
          PLAYER_BASE_Y + Math.abs(Math.sin(t * 9)) * 0.08;

        parts.torso.rotation.z = Math.sin(t * 9) * 0.025;
      } else {
        const idle = Math.sin(t * 2.2);

        parts.leftArm.root.rotation.x = THREE.MathUtils.lerp(
          parts.leftArm.root.rotation.x,
          0.05 + idle * 0.025,
          Math.min(1, deltaTime * 7)
        );

        parts.rightArm.root.rotation.x = THREE.MathUtils.lerp(
          parts.rightArm.root.rotation.x,
          -0.05 - idle * 0.025,
          Math.min(1, deltaTime * 7)
        );

        parts.leftLeg.root.rotation.x = THREE.MathUtils.lerp(
          parts.leftLeg.root.rotation.x,
          0,
          Math.min(1, deltaTime * 8)
        );

        parts.rightLeg.root.rotation.x = THREE.MathUtils.lerp(
          parts.rightLeg.root.rotation.x,
          0,
          Math.min(1, deltaTime * 8)
        );

        world.player.position.y = THREE.MathUtils.lerp(
          world.player.position.y,
          PLAYER_BASE_Y + idle * 0.025,
          Math.min(1, deltaTime * 6)
        );

        parts.torso.rotation.z = THREE.MathUtils.lerp(
          parts.torso.rotation.z,
          0,
          Math.min(1, deltaTime * 8)
        );
      }

      parts.headRoot.rotation.y = Math.sin(t * 0.8) * 0.06;

      if (state.interactionAnimation > 0) {
        state.interactionAnimation -= deltaTime;

        const p = 1 - state.interactionAnimation / 0.45;
        parts.rightArm.root.rotation.x = -1.2 + Math.sin(p * Math.PI) * 0.25;
        parts.rightArm.forearm.rotation.x = -0.5;
      } else {
        parts.rightArm.forearm.rotation.x = THREE.MathUtils.lerp(
          parts.rightArm.forearm.rotation.x,
          0,
          Math.min(1, deltaTime * 9)
        );
      }

      if (state.victoryAnimation > 0) {
        state.victoryAnimation -= deltaTime;
        parts.rightArm.root.rotation.x = -2.3;
        parts.rightArm.root.rotation.z = -0.15;
        parts.torso.rotation.z = Math.sin(t * 6) * 0.06;
      }
    }

    function constrainPlayerToIsland() {
      const x = world.player.position.x;
      const z = world.player.position.z;

      const normalizedDistance = Math.sqrt(
        (x * x) / (14.7 * 14.7) +
        (z * z) / (10.5 * 10.5)
      );

      if (normalizedDistance <= 1) return;

      world.player.position.x /= normalizedDistance;
      world.player.position.z /= normalizedDistance;
    }

    function lerpAngle(current, target, amount) {
      let difference =
        ((target - current + Math.PI) % (Math.PI * 2)) - Math.PI;

      if (difference < -Math.PI) difference += Math.PI * 2;

      return current + difference * amount;
    }

    function getCurrentMission() {
      return missions[state.missionIndex] || null;
    }

    function updateMissionUI() {
      const mission = getCurrentMission();
      if (!mission) return;

      missionLabel.textContent = `MISSION ${state.missionIndex + 1} / ${missions.length}`;

      if (mission.id === "collect-supplies") {
        missionText.textContent =
          `${mission.text} ${state.suppliesCollected}/${mission.required}`;
      } else {
        missionText.textContent = mission.text;
      }

      updateObjectiveMarkers();
    }

    function updateObjectiveMarkers() {
      const mission = getCurrentMission();

      for (const object of world.interactables) {
        if (object.userData.marker) {
          object.userData.marker.visible =
            Boolean(
              mission &&
              object.userData.active &&
              object.userData.type === mission.targetType
            );
        }
      }
    }

    function updateInteraction() {
      if (!state.inputEnabled || !world.player) {
        interactionPrompt.classList.remove("visible");
        return;
      }

      state.currentInteractable = null;
      let nearestDistance = Infinity;

      for (const object of world.interactables) {
        if (!object.userData.active) continue;

        const distance = world.player.position.distanceTo(object.position);

        if (distance < nearestDistance && distance <= INTERACTION_DISTANCE) {
          nearestDistance = distance;
          state.currentInteractable = object;
        }

        if (object.userData.marker?.visible) {
          object.userData.marker.rotation.y += 0.025;
          object.userData.marker.position.y =
            Math.sin(clock.elapsedTime * 2.2) * 0.16;
        }
      }

      if (state.currentInteractable) {
        interactionPrompt.textContent = isTouchDevice()
          ? `點擊互動：${state.currentInteractable.userData.label}`
          : `按 E：${state.currentInteractable.userData.label}`;

        interactionPrompt.classList.add("visible");
      } else {
        interactionPrompt.classList.remove("visible");
      }

      if (input.interactionRequested) {
        input.interactionRequested = false;

        if (state.currentInteractable) {
          interactWithObject(state.currentInteractable);
        } else {
          showToast("附近沒有可以互動的物件");
        }
      }
    }

    function interactWithObject(object) {
      const mission = getCurrentMission();

      if (!mission) return;

      state.interactionAnimation = 0.45;

      if (object.userData.type !== mission.targetType) {
        showBlockedMessage(object.userData.type);
        return;
      }

      switch (mission.id) {
        case "inspect-wreck":
          showToast("找到船長日誌：寶藏被藏在島嶼深處");
          advanceMission();
          break;

        case "collect-supplies":
          collectSupply(object);
          break;

        case "repair-cannon":
          repairCannon();
          break;

        case "open-treasure":
          openChest();
          break;

        case "return-to-ship":
          completeChapter();
          break;
      }
    }

    function showBlockedMessage(type) {
      const messages = {
        wreck: "擱淺船已經調查完畢",
        supply: "先完成目前任務",
        cannon: "缺少修復大砲所需的物資",
        chest: "寶藏區尚未解鎖",
        ship: "現在還不能離開島嶼"
      };

      showToast(messages[type] || "目前無法使用");
    }

    function collectSupply(object) {
      if (!object.userData.active) return;

      object.userData.active = false;
      object.visible = false;
      state.suppliesCollected += 1;

      showToast(`取得航海物資 ${state.suppliesCollected}/3`);
      updateMissionUI();

      if (state.suppliesCollected >= 3) {
        window.setTimeout(advanceMission, 450);
      }
    }

    function repairCannon() {
      if (state.cannonRepaired) {
        showToast("岸防砲已完成修復");
        return;
      }

      state.cannonRepaired = true;

      if (world.cannon) {
        world.cannon.rotation.y -= 0.35;
        world.cannon.scale.multiplyScalar(1.08);
      }

      showToast("岸防砲修復完成，寶藏區的岩石已被炸開");
      advanceMission();
    }

    function openChest() {
      if (state.chestOpened) {
        showToast("寶箱已經打開");
        return;
      }

      state.chestOpened = true;

      const fallbackLid = world.chest.getObjectByName("fallback-chest-lid");

      if (fallbackLid) {
        fallbackLid.rotation.x = -Math.PI * 0.58;
        fallbackLid.position.z = -0.28;
      } else {
        world.chest.rotation.y += 0.08;
        world.chest.scale.multiplyScalar(1.06);
      }

      showToast("取得古老金幣 × 100、失落羅盤 × 1");
      advanceMission();
    }

    function advanceMission() {
      state.missionIndex += 1;

      if (state.missionIndex >= missions.length) {
        completeChapter();
        return;
      }

      updateMissionUI();

      window.setTimeout(() => {
        const mission = getCurrentMission();
        if (mission) showToast(`新任務：${mission.text}`);
      }, 300);
    }

    function completeChapter() {
      state.inputEnabled = false;
      state.victoryAnimation = 2.0;
      resetInput();

      interactionPrompt.classList.remove("visible");
      touchControls.classList.remove("visible");

      missionLabel.textContent = "MISSION COMPLETE";
      missionText.textContent = "寶藏島探索完成";

      showToast("成功帶著寶藏返回海盜船");

      window.setTimeout(() => {
        completeScreen.classList.add("visible");
      }, 1300);
    }

    function showToast(text) {
      toastMessage.textContent = text;
      toastMessage.classList.add("visible");

      window.clearTimeout(state.toastTimer);

      state.toastTimer = window.setTimeout(() => {
        toastMessage.classList.remove("visible");
      }, 2300);
    }

    function updateCamera(deltaTime) {
      if (!world.player) return;

      const targetPosition = new THREE.Vector3(
        world.player.position.x + 15,
        19,
        world.player.position.z + 20
      );

      camera.position.lerp(
        targetPosition,
        Math.min(1, deltaTime * 3.4)
      );

      camera.lookAt(
        new THREE.Vector3(
          world.player.position.x,
          2.8,
          world.player.position.z - 1.8
        )
      );
    }

    function updateEnvironment() {
      if (world.water) {
        world.water.position.y =
          -0.68 + Math.sin(clock.elapsedTime * 0.7) * 0.025;
      }

      if (world.ship) {
        world.ship.position.y =
          -0.22 + Math.sin(clock.elapsedTime * 1.15) * 0.16;

        world.ship.rotation.z =
          Math.sin(clock.elapsedTime * 0.8) * 0.018;
      }
    }

    async function initializeGame() {
      setLoadingProgress(5, "正在建立海上環境……");

      createLights();
      createWater();
      createIsland();
      createPirateCharacter();

      setLoadingProgress(18, "正在準備寶藏島……");

      await Promise.allSettled([
        createWreck(),
        createSupplies(),
        createCannon(),
        createChest(),
        createShip()
      ]);

      updateObjectiveMarkers();

      window.setTimeout(completeLoading, 250);
    }

    initializeGame().catch((error) => {
      console.error("遊戲初始化失敗：", error);
      completeLoading();
    });

    function animate() {
      requestAnimationFrame(animate);

      const deltaTime = Math.min(clock.getDelta(), 0.05);

      updatePlayer(deltaTime);
      updateInteraction();
      updateCamera(deltaTime);
      updateEnvironment();

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
